name: ci

# Runs on every pull request and every push to master (ADR 0007). The cheap
# checks always run; the slower jobs run only when the change can affect them
# (scripts/ci-changes.sh). Pushes to master and manual runs (Actions → ci →
# Run workflow) run everything.
#
# ci-ok is the only check master requires. It fails unless every job did what
# the change detection asked for (scripts/ci-gate.sh), so a job skipped by
# mistake cannot pass as green.
#
# The release pull request also runs every PatientZero scenario and the 48
# hour backfill (scenarios.yml, under three hours), so no release is tagged
# while one fails. It is chosen by its branch, not its paths, so pushes to master
# and manual runs of this workflow leave it out; scenarios.yml runs it nightly.
#
# Do not add `paths:` filters to these triggers: a required check whose
# workflow never starts is never reported, and the pull request waits forever.
# To add a job: give it `needs: changes` and an `if:` on a flag (add the flag
# to scripts/ci-changes.sh and its test), and add it to ci-ok's needs and
# arguments.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Go caches: the Makefile builds in .tmp/gocache, so setup-go's own cache, of
# the default location, stays empty. The jobs that compile restore .tmp/gocache
# and the modules instead, and only the test job, which compiles the most,
# saves them. It does not save on a pull request, whose cache would serve only
# that pull request. kind-e2e builds inside Docker, so it restores nothing. The
# key follows the Go dependencies, so a new entry appears about weekly, and
# restore-keys starts it from the previous one. Go deletes build cache files not
# used for 5 days, going by their modification time, which a restore keeps, and
# its first build would empty an entry of that age. So an exact hit is touched.
# A restore from an older key is not, so what no build uses still leaves the
# entry saved from it, and the cache does not grow forever.

# A new push to a pull request cancels its older run. Runs on master are never
# cancelled: a release checks the run of its tagged commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      db_collector: ${{ steps.detect.outputs.db_collector }}
      chart: ${{ steps.detect.outputs.chart }}
      kind_e2e: ${{ steps.detect.outputs.kind_e2e }}
      web: ${{ steps.detect.outputs.web }}
      # release-please's pull request, from this repository, not a fork.
      scenarios: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--master') && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request runs on its merge commit; its first parent is the
          # target branch, so HEAD^1..HEAD is exactly what the pull request
          # changes.
          fetch-depth: 2
      - id: detect
        name: Decide which jobs this change needs
        env:
          CI_RUN_ALL: ${{ github.event_name != 'pull_request' }}
        run: |
          : >changed.txt
          if [ "$CI_RUN_ALL" != true ]; then
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
              # --no-renames lists both sides of a move, so moving a file out
              # of a component still counts as changing that component.
              git diff --name-only --no-renames HEAD^1 HEAD >changed.txt
            else
              echo "HEAD is not a merge commit; running every job"
              CI_RUN_ALL=true
            fi
          fi
          scripts/ci-changes.sh <changed.txt | tee -a "$GITHUB_OUTPUT" >flags.txt
          {
            echo "## Change detection"
            echo
            if [ "$CI_RUN_ALL" = true ]; then
              echo "Every job runs (${{ github.event_name }})."
            else
              echo "$(wc -l <changed.txt | tr -d ' ') changed paths:"
              echo
              echo '```'
              cat changed.txt
              echo '```'
            fi
            echo
            echo '```'
            cat flags.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat flags.txt

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            .tmp/gocache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.mod', 'tools/*/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Keep Go from trimming the restored cache
        if: steps.go-cache.outputs.cache-hit == 'true'
        run: find .tmp/gocache -type f -exec touch {} +
      - name: Check generated code is current
        run: make generate-check
      # -count=1 so a restored cache cannot replay a test result: it only saves
      # compiling.
      - name: Run Go tests with the race detector
        env:
          GOFLAGS: -count=1
        run: make test-race
      - name: Run Go static checks
        run: make vet
      - name: Check for reachable known vulnerabilities
        run: make vulncheck
      - name: Validate Prometheus rules
        run: make rules-check
      - name: Build the HTML docs site (fails on broken links, images or anchors)
        run: make docs-site
      - name: Run isolated PostgreSQL and Valkey integration tests
        run: make test-integration
      - name: Save the Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            .tmp/gocache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  web:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # --ignore-scripts: no dependency runs code at install. The app's own
      # postinstall only fences node_modules from Go, which this job lacks.
      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts --no-fund
      - name: Check the client generated from openapi.yaml is current
        run: |
          npm run generate
          git diff --exit-code -- src/api/schema.gen.ts || {
            echo "::error::apps/web/src/api/schema.gen.ts is stale: run make generate and commit the result"
            exit 1
          }
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high

  sqlserver:
    name: SQL Server probes
    needs: changes
    if: needs.changes.outputs.db_collector == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            .tmp/gocache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.mod', 'tools/*/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Keep Go from trimming the restored cache
        if: steps.go-cache.outputs.cache-hit == 'true'
        run: find .tmp/gocache -type f -exec touch {} +
      - name: Run every SQL Server probe and PatientZero's live test against a disposable SQL Server
        run: make test-sqlserver

  chart:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            .tmp/gocache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.mod', 'tools/*/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Keep Go from trimming the restored cache
        if: steps.go-cache.outputs.cache-hit == 'true'
        run: find .tmp/gocache -type f -exec touch {} +
      - name: Install pinned kind, kubectl, Helm 4 and Helm 3
        run: |
          make install-tools
          echo "$PWD/.tmp/bin" >> "$GITHUB_PATH"
      - name: Fetch chart dependencies (Chart.lock)
        run: make chart-deps
      - name: Lint and render every profile with Helm 4
        run: make chart-check
      - name: Render every profile with Helm 3
        run: make chart-check HELM="$PWD/.tmp/bin/helm3"

  kind-e2e:
    name: kind end-to-end
    needs: changes
    # Alongside the chart checks, not after them: ci-ok requires both, and they
    # rarely fail, so waiting for them would delay every run to save a few.
    if: needs.changes.outputs.kind_e2e == 'true'
    runs-on: ubuntu-26.04
    # 10-19 minutes in October 2026 (ADR 0003). A job that grows past this
    # trims its checks rather than raising the timeout.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned kind, kubectl and Helm
        run: |
          make install-tools
          echo "$PWD/.tmp/bin" >> "$GITHUB_PATH"
      - name: Check tool versions
        run: make tools-check
      - name: Fetch chart dependencies (Chart.lock)
        run: make chart-deps
      # Creates its own kind cluster with the pinned node image, builds and
      # loads both images, starts a SQL Server container and runs the ADR 0003
      # acceptance checks; removes everything it created on exit.
      - name: Run acceptance checks on kind
        run: make kind-e2e

  scenarios:
    name: PatientZero scenarios
    needs: changes
    if: ${{ needs.changes.outputs.scenarios == 'true' }}
    uses: ./.github/workflows/scenarios.yml

  ci-ok:
    name: ci-ok
    needs: [changes, test, web, sqlserver, chart, kind-e2e, scenarios]
    # always(), not !cancelled(): a gate skipped on failure or cancellation
    # would count as passed.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job did what the change detection asked for
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh changes test web:web sqlserver:db_collector chart:chart kind-e2e:kind_e2e scenarios:scenarios
