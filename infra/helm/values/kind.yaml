# kind (local development and CI). Layer over the chart defaults:
#   helm upgrade --install atrium infra/helm/atrium -n atrium \
#     -f infra/helm/values/kind.yaml [-f infra/helm/values/minimal.yaml] ...
# scripts/kind.sh does this and sets the image tags.
#
# Services are NodePorts that infra/kind/cluster.yaml maps to the same
# 127.0.0.1 ports the Compose stack used.

telemetry:
  environment: local

dbCollector:
  image:
    # The image scripts/kind.sh builds, not the release image the chart
    # defaults to. Loaded into the node with `kind load`; never pulled.
    # scripts/kind.sh sets a content-derived tag, so a stale image cannot hide
    # a code change.
    repository: atrium/db-collector
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30082
    # Keeps the host's source address on NodePort traffic. With Cluster,
    # kube-proxy masquerades it to the node's pod-network gateway and kindnet
    # drops it, which breaks `make health`.
    externalTrafficPolicy: Local
  networkPolicy:
    # Operator access from outside the pod network: on kind that is the
    # developer's host through the loopback-bound NodePort (infra/kind/
    # cluster.yaml) and containers on the Docker kind network. Pods stay
    # limited to Prometheus. The except range is kind's default pod subnet.
    # The kubelet's probes and the API server's pod proxy (kind-e2e) come
    # from the pod's own node, which NetworkPolicy does not filter.
    #
    # The host -> NodePort path (with externalTrafficPolicy Local above) was
    # verified by hand on kind v0.33 with kindnet; kind-e2e does not cover it,
    # because its cluster has no host port mappings.
    operators:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16
    # Egress on, as production should have it: the sandbox SQL Server is a
    # container on the Docker kind network, outside the pod subnet, so the
    # targets are everything but the pods; other pods and Services (whose
    # addresses NetworkPolicy sees as their pods') are out of reach but for
    # DNS and the OTel Collector. kind-e2e checks it.
    egress:
      enabled: true
      targets:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16

# The API's image, built and loaded like the collector's; scripts/kind.sh sets
# its tag. PostgreSQL and Valkey are the chart's bundled ones, with Secrets
# that scripts/kind.sh generates once per cluster.
api:
  image:
    repository: atrium/api
    pullPolicy: Never
  # `kubectl port-forward svc/api 8081` (docs/guides/local-development.md).
  # Browsers treat localhost as secure, so they keep the __Host- session
  # cookie over plain HTTP.
  siteOrigin: http://localhost:8081
  # local-dev, the environment the kind collectors report, as code
  # (ADR 0021): the API applies it at start, and its rows refuse the API's
  # writes. PatientZero (make patientzero-up) is its application; its
  # outsystems_logs collector extracts local-dev, so the source is observed
  # while PatientZero runs. Its database target is the sandbox SQL Server
  # (make sqlserver-dev-up), named patientzero beside sqlserver-dev.yaml's
  # own sqlserver-dev collector (the collector refuses one target name in
  # two collectors), with probes the file approves: make
  # kind-assignments renders them into managedCollectors. Without the
  # sandbox the target is only down; scripts/kind.sh points it at a
  # throwaway cluster's own container. kind-e2e checks the file is applied.
  # A production environment keeps this as a file of its own in the
  # configuration repository, passed with --set-file.
  inventory: |
    version: 1
    environment:
      slug: local-dev
      name: Local development
      type: development
      description: The kind cluster's environment (infra/helm/values/kind.yaml)
    applications:
      - name: PatientZero
        platform: outsystems
        owner_team: Atrium
        criticality: low
        components:
          - name: Shop
            type: traditional_web_app
            runtime_name: PatientZero
        telemetry_sources:
          - type: outsystems
            ingest_mode: agentless
            config:
              application_name: PatientZero
    database_targets:
      # The server, not one of PatientZero's databases: the collector's
      # login has a user only in patientzero_log, and these probes read
      # server-wide views. The credential is the sandbox's collector login,
      # from the Secret make sqlserver-dev-up creates.
      - name: patientzero
        host: atrium-sqlserver-dev
        credential_ref: env/sqlserver-dev
        probes:
          - name: sessions
            interval_seconds: 30
          - name: blocking
            interval_seconds: 30
          - name: waits
            interval_seconds: 30

# The same operator access to the engines with a loopback NodePort (make
# health, the demo helpers): Prometheus, Alertmanager and the OTel Collector's
# OTLP ports. Pods stay limited to the components that use each engine. Loki
# has no NodePort: operators reach it with `kubectl port-forward`, which
# NetworkPolicy does not filter. Verified by hand on kind v0.33 with kindnet:
# the host reaches all three through their NodePorts, and Alertmanager's
# times out without this peer. Their Services keep externalTrafficPolicy
# Cluster (Alertmanager's chart has no setting for it), and the host's traffic
# still matched the range in that check, unlike what the collector's comment
# above found earlier. kind-e2e checks that a pod is still refused through
# these NodePorts.
backendNetworkPolicies:
  otelCollector:
    extraPeers:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16
  prometheus:
    extraPeers:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16
  alertmanager:
    extraPeers:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16

prometheus:
  server:
    retention: 2d
    persistentVolume:
      size: 2Gi
    service:
      type: NodePort
      nodePort: 30090
  alertmanager:
    service:
      type: NodePort
      nodePort: 30093

grafana:
  service:
    type: NodePort
    nodePort: 30300
  # Admin login is admin/admin from the grafana-admin Secret scripts/kind.sh
  # creates. Anonymous viewers are allowed only here, behind loopback ports.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer

loki:
  singleBinary:
    persistence:
      size: 2Gi

otelCollector:
  service:
    type: NodePort
  ports:
    otlp:
      nodePort: 30317
    otlp-http:
      nodePort: 30318
    # Not mapped to the host, so a fixed port only keeps it out of the other
    # NodePorts' way: it would get a random one otherwise.
    otlp-self:
      nodePort: 30319
