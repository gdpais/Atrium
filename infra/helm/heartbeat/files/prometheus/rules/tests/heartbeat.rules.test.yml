# promtool unit tests for the chart's rule files; run with `make rules-check`.
rule_files:
  - ../heartbeat.rules.yml
  - ../heartbeat-config-reload.rules.yml
  - ../heartbeat-collector-missing.rules.yml
  - ../heartbeat-self.rules.yml

evaluation_interval: 1m

tests:
  - name: SQL Server wait rate survives a SQL Server restart
    interval: 1m
    input_series:
      # +60 s of waits per minute, then the counter resets (restart) and resumes.
      - series: 'heartbeat_sqlserver_wait_seconds_total{collector="c",environment="dev",target="db1",wait_type="LCK_M_S"}'
        values: '0 60 120 180 240 300 0 60 120 180 240 300'
    promql_expr_test:
      - expr: heartbeat:sqlserver_wait_seconds:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'heartbeat:sqlserver_wait_seconds:rate5m{environment="dev",target="db1",wait_type="LCK_M_S"}'
            value: 1
      # A window spanning the restart (4m..8m: 240 300 0 60 120) counts the
      # drop as a reset, not as -300: 180 s of waits seen over 240 s,
      # extrapolated to the 5m window, is 0.75 and never negative.
      - expr: heartbeat:sqlserver_wait_seconds:rate5m
        eval_time: 8m
        exp_samples:
          - labels: 'heartbeat:sqlserver_wait_seconds:rate5m{environment="dev",target="db1",wait_type="LCK_M_S"}'
            value: 0.75
      - expr: heartbeat:sqlserver_wait_seconds:rate5m
        eval_time: 11m
        exp_samples:
          - labels: 'heartbeat:sqlserver_wait_seconds:rate5m{environment="dev",target="db1",wait_type="LCK_M_S"}'
            value: 1

  - name: Blocked requests are 0 when idle, counted when blocked, absent when unreachable or the blocking probe fails
    interval: 1m
    input_series:
      - series: 'heartbeat_collector_probe_up{collector="c",environment="dev",target="idle",probe="blocking"}'
        values: '1x5'
      - series: 'heartbeat_collector_probe_up{collector="c",environment="dev",target="busy",probe="blocking"}'
        values: '1x5'
      - series: 'heartbeat_sqlserver_blocked_requests{collector="c",environment="dev",target="busy",blocking_session_id="61"}'
        values: '2x5'
      - series: 'heartbeat_sqlserver_blocked_requests{collector="c",environment="dev",target="busy",blocking_session_id="72"}'
        values: '1x5'
      - series: 'heartbeat_collector_target_up{collector="c",environment="dev",target="down"}'
        values: '0x5'
      - series: 'heartbeat_collector_probe_up{collector="c",environment="dev",target="down",probe="blocking"}'
        values: '0x5'
      # Degraded: the target is up, but its blocking probe fails.
      - series: 'heartbeat_collector_target_up{collector="c",environment="dev",target="broken"}'
        values: '1x5'
      - series: 'heartbeat_collector_probe_up{collector="c",environment="dev",target="broken",probe="blocking"}'
        values: '0x5'
      - series: 'heartbeat_collector_probe_up{collector="c",environment="dev",target="broken",probe="throughput"}'
        values: '1x5'
    promql_expr_test:
      - expr: heartbeat:sqlserver_blocked_requests:sum
        eval_time: 5m
        exp_samples:
          - labels: 'heartbeat:sqlserver_blocked_requests:sum{environment="dev",target="busy"}'
            value: 3
          - labels: 'heartbeat:sqlserver_blocked_requests:sum{environment="dev",target="idle"}'
            value: 0

  - name: Sessions are summed across statuses
    interval: 1m
    input_series:
      - series: 'heartbeat_sqlserver_sessions{collector="c",environment="dev",target="db1",status="running"}'
        values: '4x5'
      - series: 'heartbeat_sqlserver_sessions{collector="c",environment="dev",target="db1",status="sleeping"}'
        values: '40x5'
    promql_expr_test:
      - expr: heartbeat:sqlserver_sessions:sum
        eval_time: 5m
        exp_samples:
          - labels: 'heartbeat:sqlserver_sessions:sum{environment="dev",target="db1"}'
            value: 44

  - name: Watchdog fires with no input at all
    interval: 1m
    alert_rule_test:
      - alertname: Watchdog
        eval_time: 1m
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Heartbeat alerting pipeline is alive"
              description: "Always firing. If the dead-man's switch stops receiving it, Heartbeat alerting is down."

  - name: Elevated collector login fires after 15 minutes, a least-privilege one never
    interval: 1m
    input_series:
      - series: 'heartbeat_collector_target_login_sysadmin{collector="c",environment="dev",target="db1"}'
        values: '1x30'
      - series: 'heartbeat_collector_target_login_sysadmin{collector="c",environment="dev",target="db2"}'
        values: '0x30'
    alert_rule_test:
      - alertname: HeartbeatCollectorLoginElevated
        eval_time: 10m
        exp_alerts: []
      - alertname: HeartbeatCollectorLoginElevated
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: c
              environment: dev
              target: db1
            exp_annotations:
              summary: "db-collector logs in to dev/db1 as a sysadmin-equivalent login"
              description: "The collector login for db1 is a member of sysadmin or holds CONTROL SERVER. Give it only VIEW SERVER STATE and VIEW ANY DEFINITION."

  - name: A rejected config reload alerts after 2 minutes and clears on the next good one
    interval: 1m
    input_series:
      # Loaded, rejected at 2m, fixed at 6m.
      - series: 'heartbeat_collector_config_last_reload_successful{instance="10.244.0.7:8082",job="db-collector"}'
        values: '1 1 0 0 0 0 1 1'
    alert_rule_test:
      - alertname: HeartbeatCollectorConfigReloadFailed
        eval_time: 1m
        exp_alerts: []
      # Pending, not firing, a minute after the rejection.
      - alertname: HeartbeatCollectorConfigReloadFailed
        eval_time: 3m
        exp_alerts: []
      - alertname: HeartbeatCollectorConfigReloadFailed
        eval_time: 4m
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.244.0.7:8082
              job: db-collector
            exp_annotations:
              summary: "db-collector 10.244.0.7:8082 did not apply its last config change"
              description: "The db-collector rejected or could not apply its last config reload and still runs the last good config: the change has not taken effect. The reason is last_reload_err in GET /admin/config, and the \"config reload rejected\" or \"config reload failed\" line in the pod log. Fix the config and apply it again; the alert clears on the next successful reload. If the file itself is invalid, a restarted pod does not start until it is fixed."
      - alertname: HeartbeatCollectorConfigReloadFailed
        eval_time: 6m
        exp_alerts: []

  - name: OutSystems request error ratio covers user-facing requests only
    interval: 1m
    input_series:
      # 57 good and 3 failed screen requests a minute: 5% errors.
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",operation="Checkout",outcome="success"}'
        values: '0+57x10'
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",operation="Checkout",outcome="error"}'
        values: '0+3x10'
      # Failing timers are not requests.
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Shop",module="Shop_BL",log_type="cyclic_job",operation="ProcessOrders",outcome="error"}'
        values: '0+50x10'
      # No errors yet: the error series exists at 0, so the ratio is 0.
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Users",module="Users",log_type="mobile_request",operation="Login",outcome="success"}'
        values: '0+10x10'
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Users",module="Users",log_type="mobile_request",operation="Login",outcome="error"}'
        values: '0x10'
    promql_expr_test:
      - expr: heartbeat:outsystems_request_errors:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'heartbeat:outsystems_request_errors:ratio_rate5m{environment="prod",application="Shop"}'
            value: 0.05
          - labels: 'heartbeat:outsystems_request_errors:ratio_rate5m{environment="prod",application="Users"}'
            value: 0

  - name: OutSystems slow request ratio reads the 2 s bucket in either le format
    interval: 1m
    input_series:
      # Shop: 50 of 100 requests a minute within 2 s.
      - series: 'heartbeat_outsystems_operation_duration_seconds_bucket{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",outcome="success",le="2"}'
        values: '0+50x10'
      - series: 'heartbeat_outsystems_operation_duration_seconds_count{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",outcome="success"}'
        values: '0+100x10'
      # Users, as Prometheus 3 stores le after scraping: 3 of 4 within 2 s.
      - series: 'heartbeat_outsystems_operation_duration_seconds_bucket{collector="c",environment="prod",application="Users",module="Users",log_type="mobile_request",outcome="success",le="2.0"}'
        values: '0+3x10'
      - series: 'heartbeat_outsystems_operation_duration_seconds_count{collector="c",environment="prod",application="Users",module="Users",log_type="mobile_request",outcome="success"}'
        values: '0+4x10'
    promql_expr_test:
      - expr: heartbeat:outsystems_request_slow:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'heartbeat:outsystems_request_slow:ratio_rate5m{environment="prod",application="Shop"}'
            value: 0.5
          - labels: 'heartbeat:outsystems_request_slow:ratio_rate5m{environment="prod",application="Users"}'
            value: 0.25

  - name: OutSystems fast error budget burn pages, but not for an application with almost no traffic
    interval: 1m
    input_series:
      # Shop: 10% of 100 requests a minute fail from the start.
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",operation="Checkout",outcome="success"}'
        values: '0+90x80'
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",operation="Checkout",outcome="error"}'
        values: '0+10x80'
      # Quiet: 2% of 3 requests a minute fail, 20 times the 0.1% budget, but
      # that is under the 5 requests a minute an error page needs.
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Quiet",module="Quiet",log_type="screen",operation="Home",outcome="success"}'
        values: '0+2.94x80'
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Quiet",module="Quiet",log_type="screen",operation="Home",outcome="error"}'
        values: '0+0.06x80'
      # Rare: every request fails, but there is one every two minutes.
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Rare",module="Rare",log_type="screen",operation="Home",outcome="success"}'
        values: '0x80'
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Rare",module="Rare",log_type="screen",operation="Home",outcome="error"}'
        values: '0+0.5x80'
    alert_rule_test:
      - alertname: OutSystemsErrorBudgetBurnFast
        eval_time: 1m
        exp_alerts: []
      - alertname: OutSystemsErrorBudgetBurnFast
        eval_time: 70m
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              application: Shop
            exp_annotations:
              summary: "prod/Shop is burning its error budget fast"
              description: "10% of requests failed over the last hour, more than 14.4 times the 0.1% budget."

  - name: OutSystems fast latency budget burn pages
    interval: 1m
    input_series:
      # Half of the requests take more than 2 s.
      - series: 'heartbeat_outsystems_operation_duration_seconds_bucket{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",outcome="success",le="2"}'
        values: '0+50x80'
      - series: 'heartbeat_outsystems_operation_duration_seconds_count{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",outcome="success"}'
        values: '0+100x80'
      - series: 'heartbeat_outsystems_operations_total{collector="c",environment="prod",application="Shop",module="Shop_CS",log_type="screen",operation="Checkout",outcome="success"}'
        values: '0+100x80'
    alert_rule_test:
      - alertname: OutSystemsLatencyBudgetBurnFast
        eval_time: 70m
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              application: Shop
            exp_annotations:
              summary: "prod/Shop is slow"
              description: "50% of requests took more than 2 s over the last hour, more than 14.4 times the 1% budget."

  - name: OutSystems log extraction behind fires after 10 minutes past half an hour
    interval: 1m
    input_series:
      - series: 'heartbeat_outsystems_extract_lag_seconds{collector="oslogs",environment="prod",target="logging-db",log_type="screen"}'
        values: '2000x15'
      - series: 'heartbeat_outsystems_extract_lag_seconds{collector="oslogs",environment="prod",target="logging-db",log_type="error"}'
        values: '120x15'
    alert_rule_test:
      - alertname: OutSystemsLogExtractionBehind
        eval_time: 5m
        exp_alerts: []
      - alertname: OutSystemsLogExtractionBehind
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: oslogs
              environment: prod
              target: logging-db
              log_type: screen
            exp_annotations:
              summary: "OutSystems screen logs of prod/logging-db are 33m 20s behind"
              description: "The oslogs collector has not extracted screen rows for more than 30 minutes. Logs, derived metrics and the OutSystems SLO alerts for this target are stale. Check the collector's probe errors and OTLP export failures, and heartbeat_outsystems_export_blocked: at 1 the OTel Collector holds the rows back, usually because Loki is down or slow."

  - name: Loki discarding log rows fires for every reason but the rate limit
    interval: 1m
    input_series:
      - series: 'loki_discarded_samples_total{reason="too_far_behind",tenant="fake"}'
        values: '0x5 100x20'
      - series: 'loki_discarded_samples_total{reason="rate_limited",tenant="fake"}'
        values: '0+1000x25'
    alert_rule_test:
      - alertname: LokiDiscardingLogs
        eval_time: 4m
        exp_alerts: []
      - alertname: LokiDiscardingLogs
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              severity: warning
              reason: too_far_behind
            exp_annotations:
              summary: "Loki is discarding log rows (too_far_behind)"
              description: "Loki discarded log rows in the last 10 minutes for too_far_behind; they are not in Loki and will not be sent again. too_far_behind means rows arrived more than an hour behind their stream: check that the OTel Collector's logs exporter keeps one consumer and a queue of one request, which keep its batches in order, across restarts too."
      - alertname: LokiDiscardingLogs
        eval_time: 20m
        exp_alerts: []

  - name: OutSystems log export blocked fires once per target after 2 minutes, not for a restart
    interval: 1m
    input_series:
      # Both log types of logging-db wait on the Collector for 5 minutes;
      # other-db's for one, as during a Loki restart.
      - series: 'heartbeat_outsystems_export_blocked{collector="oslogs",environment="prod",target="logging-db",log_type="screen",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 1 1 1 1 1 0 0 0'
      - series: 'heartbeat_outsystems_export_blocked{collector="oslogs",environment="prod",target="logging-db",log_type="error",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 1 1 1 1 1 0 0 0'
      - series: 'heartbeat_outsystems_export_blocked{collector="oslogs",environment="prod",target="other-db",log_type="screen",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 1 0 0 0 0 0 0 0'
    alert_rule_test:
      - alertname: OutSystemsLogExportBlocked
        eval_time: 2m
        exp_alerts: []
      - alertname: OutSystemsLogExportBlocked
        eval_time: 4m
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: oslogs
              environment: prod
              target: logging-db
            exp_annotations:
              summary: "OutSystems log export of prod/logging-db is blocked"
              description: "The oslogs collector has waited more than 2 minutes for the OTel Collector to accept a batch of logs, and reads nothing more until it does: logs, derived metrics and the OutSystems SLO alerts for this target go stale. Nothing is lost while the rows are still in the logging database's views (the current and the previous week). Usually Loki is down or slow; HeartbeatServiceDown says whether Loki or the OTel Collector is down, and GET /admin/config shows what each log type waits for."
      - alertname: OutSystemsLogExportBlocked
        eval_time: 7m
        exp_alerts: []

  - name: Heartbeat service down fires for Loki, not for a service that answers
    interval: 1m
    input_series:
      - series: 'up{job="loki",instance="loki:3100"}'
        values: '1 0 0 0 0 1 1'
      - series: 'up{job="otel-collector",instance="otel-collector:8889"}'
        values: '1x6'
      - series: 'up{job="db-collector",instance="10.0.0.1:8082"}'
        values: '1x6'
    alert_rule_test:
      - alertname: HeartbeatServiceDown
        eval_time: 2m
        exp_alerts: []
      - alertname: HeartbeatServiceDown
        eval_time: 4m
        exp_alerts:
          - exp_labels:
              severity: warning
              job: loki
              instance: loki:3100
            exp_annotations:
              summary: "Heartbeat service loki is down"
              description: "Prometheus has not scraped loki successfully for at least 2 minutes."
      - alertname: HeartbeatServiceDown
        eval_time: 6m
        exp_alerts: []

  - name: Heartbeat service down fires for a db-collector with no pod to scrape
    interval: 1m
    input_series:
      # The pod is gone from 2m to 5m: DNS discovery drops its target, so
      # its up series goes stale instead of reporting 0.
      - series: 'up{job="db-collector",instance="10.0.0.1:8082"}'
        values: '1 1 stale _x3 1x4'
      - series: 'up{job="otel-collector",instance="otel-collector:8889"}'
        values: '1x10'
    alert_rule_test:
      - alertname: HeartbeatServiceDown
        eval_time: 3m
        exp_alerts: []
      - alertname: HeartbeatServiceDown
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              severity: warning
              job: db-collector
            exp_annotations:
              summary: "Heartbeat service db-collector is down"
              description: "Prometheus has found no db-collector pod to scrape for at least 2 minutes: its StatefulSet runs no pod. Nothing is collected from SQL Server or the OutSystems logging databases meanwhile; once it is back, the OutSystems log types resume from their saved watermarks."
      - alertname: HeartbeatServiceDown
        eval_time: 7m
        exp_alerts: []

  - name: OutSystems late log rows fire while the recount finds them, then clear
    interval: 1m
    input_series:
      # Three late rows at 3m, none after; no other log type finds any.
      - series: 'heartbeat_outsystems_late_rows_total{collector="oslogs",environment="prod",target="logging-db",log_type="screen",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 0 0 3x30'
      - series: 'heartbeat_outsystems_late_rows_total{collector="oslogs",environment="prod",target="logging-db",log_type="error",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0x33'
    alert_rule_test:
      - alertname: OutSystemsLateLogRows
        eval_time: 2m
        exp_alerts: []
      - alertname: OutSystemsLateLogRows
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: oslogs
              environment: prod
              target: logging-db
              log_type: screen
            exp_annotations:
              summary: "OutSystems screen log rows of prod/logging-db were committed too late to be read"
              description: "The oslogs collector's recount found about 3 screen rows in the last 15 minutes that the log service committed after the collector had read past their Instant, later than the lag. They are not in Loki, and the derived metrics and SLOs undercount them. Raise this log type's lag (probes[].lag) above how late the log service commits; late commits usually mean it is behind."
      - alertname: OutSystemsLateLogRows
        eval_time: 20m
        exp_alerts: []

  - name: OutSystems duplicate log rows fire when the recount finds any
    interval: 1m
    input_series:
      - series: 'heartbeat_outsystems_duplicate_rows_total{collector="oslogs",environment="prod",target="logging-db",log_type="general",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 0 2x20'
    alert_rule_test:
      - alertname: OutSystemsDuplicateLogRows
        eval_time: 1m
        exp_alerts: []
      - alertname: OutSystemsDuplicateLogRows
        eval_time: 4m
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: oslogs
              environment: prod
              target: logging-db
              log_type: general
            exp_annotations:
              summary: "OutSystems general log rows of prod/logging-db were delivered more often than the logging database holds them"
              description: "The oslogs collector's recount found about 2 general rows in the last 15 minutes that it delivered more often than the logging database holds them. Either the extraction read them twice, a defect: Loki holds them twice and the derived metrics count them twice; report it with the collector's log, which names the minutes. Or rows were deleted from the logging database after they were sent."

  - name: OutSystems derived series overflow fires per collector while rows are dropped, then clears
    interval: 1m
    input_series:
      # From 2m, two metrics of oslogs drop updates; the other collector is
      # within its budget.
      - series: 'heartbeat_outsystems_derived_series_overflow_total{collector="oslogs",metric="heartbeat_outsystems_operations_total",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 0 2x20'
      - series: 'heartbeat_outsystems_derived_series_overflow_total{collector="oslogs",metric="heartbeat_outsystems_operation_seconds_total",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 0 1x20'
      - series: 'heartbeat_outsystems_derived_series_overflow_total{collector="oslogs-staging",metric="heartbeat_outsystems_operations_total",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0x22'
    alert_rule_test:
      - alertname: OutSystemsDerivedSeriesOverflow
        eval_time: 1m
        exp_alerts: []
      - alertname: OutSystemsDerivedSeriesOverflow
        eval_time: 4m
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: oslogs
            exp_annotations:
              summary: "The oslogs collector's derived OutSystems metrics are full"
              description: "The oslogs collector dropped about 3 updates of its derived metrics in the last 15 minutes: the rows needed new series and it already holds its max_derived_series (heartbeat_outsystems_derived_series). Series that exist keep counting, but new applications, modules, operations or front-ends are missing from the derived metrics, the OutSystems dashboards and the SLO alerts. The metric label of the overflow counter says which metric it is; raise max_derived_series if the collector's memory allows (about 690 bytes a series)."
      - alertname: OutSystemsDerivedSeriesOverflow
        eval_time: 20m
        exp_alerts: []

  - name: OutSystems log recount failing fires when most recounts fail, not for one, at any poll interval
    interval: 1m
    input_series:
      # screen recounts every 3 minutes and every one fails; error recounts
      # every minute and fails once.
      - series: 'heartbeat_outsystems_recounts_total{collector="oslogs",environment="prod",target="logging-db",log_type="screen",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 0 0 1 1 1 2 2 2 3 3 3 4 4 4 5 5 5 6 6 6'
      - series: 'heartbeat_outsystems_recount_failures_total{collector="oslogs",environment="prod",target="logging-db",log_type="screen",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 0 0 1 1 1 2 2 2 3 3 3 4 4 4 5 5 5 6 6 6'
      - series: 'heartbeat_outsystems_recounts_total{collector="oslogs",environment="prod",target="logging-db",log_type="error",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0+1x20'
      - series: 'heartbeat_outsystems_recount_failures_total{collector="oslogs",environment="prod",target="logging-db",log_type="error",job="db-collector",instance="10.0.0.1:8082"}'
        values: '0 1x20'
    alert_rule_test:
      - alertname: OutSystemsLogRecountFailing
        eval_time: 1m
        exp_alerts: []
      - alertname: OutSystemsLogRecountFailing
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: oslogs
              environment: prod
              target: logging-db
              log_type: screen
            exp_annotations:
              summary: "OutSystems screen log recount of prod/logging-db is failing"
              description: "Most recounts of the oslogs collector's screen rows failed in the last 15 minutes, so rows committed past the lag, or sent twice, are not counted. The reason is in the collector's log (\"outsystems_logs recount failed\"); extraction itself goes on."

  - name: Late collector cycles burn their budget; on-time cycles do not
    interval: 1m
    input_series:
      # 4 cycles a minute, a quarter of them late, for 90 minutes.
      - series: 'heartbeat_collector_cycles_total{collector="slow",outcome="on_time",job="db-collector",instance="i"}'
        values: '0+3x90'
      - series: 'heartbeat_collector_cycles_total{collector="slow",outcome="late",job="db-collector",instance="i"}'
        values: '0+1x90'
      - series: 'heartbeat_collector_cycles_total{collector="fine",outcome="on_time",job="db-collector",instance="i"}'
        values: '0+4x90'
      - series: 'heartbeat_collector_cycles_total{collector="fine",outcome="late",job="db-collector",instance="i"}'
        values: '0x90'
    promql_expr_test:
      - expr: heartbeat:collector_cycles_late:ratio_rate1h
        eval_time: 70m
        exp_samples:
          - labels: 'heartbeat:collector_cycles_late:ratio_rate1h{collector="slow"}'
            value: 0.25
          - labels: 'heartbeat:collector_cycles_late:ratio_rate1h{collector="fine"}'
            value: 0
    alert_rule_test:
      - eval_time: 70m
        alertname: HeartbeatCollectorCyclesLateFast
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: slow
            exp_annotations:
              summary: "The slow collector's cycles run late"
              description: "25% of its cycles over the last hour used their whole interval or panicked, more than 14.4 times the 0.5% budget, so its metrics arrive late or with gaps. See heartbeat_collector_probe_duration_seconds for the probe that takes the time: often a slow monitored database. A panic is in the service's log."

  - name: Extraction freshness counts the lag beyond its setting, and a target that is down
    interval: 1m
    input_series:
      # behind: 10 minutes over a 1-minute setting. slow: a 5-minute setting,
      # 10 s over it, which is fresh. down: a frozen gauge, but the target is down.
      - series: 'heartbeat_outsystems_extract_lag_seconds{collector="c",environment="e",target="behind",log_type="error"}'
        values: '660x400'
      - series: 'heartbeat_outsystems_extract_lag_setting_seconds{collector="c",environment="e",target="behind",log_type="error"}'
        values: '60x400'
      - series: 'heartbeat_collector_target_up{collector="c",environment="e",target="behind"}'
        values: '1x400'
      - series: 'heartbeat_outsystems_extract_lag_seconds{collector="c",environment="e",target="slow",log_type="error"}'
        values: '310x400'
      - series: 'heartbeat_outsystems_extract_lag_setting_seconds{collector="c",environment="e",target="slow",log_type="error"}'
        values: '300x400'
      - series: 'heartbeat_collector_target_up{collector="c",environment="e",target="slow"}'
        values: '1x400'
      - series: 'heartbeat_outsystems_extract_lag_seconds{collector="c",environment="e",target="down",log_type="error"}'
        values: '70x400'
      - series: 'heartbeat_outsystems_extract_lag_setting_seconds{collector="c",environment="e",target="down",log_type="error"}'
        values: '60x400'
      - series: 'heartbeat_collector_target_up{collector="c",environment="e",target="down"}'
        values: '0x400'
    promql_expr_test:
      - expr: heartbeat:outsystems_extract_fresh:ratio_avg1h
        eval_time: 70m
        exp_samples:
          - labels: 'heartbeat:outsystems_extract_fresh:ratio_avg1h{collector="c",environment="e",target="behind",log_type="error"}'
            value: 0
          - labels: 'heartbeat:outsystems_extract_fresh:ratio_avg1h{collector="c",environment="e",target="slow",log_type="error"}'
            value: 1
          - labels: 'heartbeat:outsystems_extract_fresh:ratio_avg1h{collector="c",environment="e",target="down",log_type="error"}'
            value: 0
    alert_rule_test:
      - eval_time: 70m
        alertname: HeartbeatExtractionFreshnessBurn
        exp_alerts:
          - exp_labels: {severity: warning, collector: c, environment: e, target: behind, log_type: error}
            exp_annotations:
              summary: "OutSystems log type error of behind is often behind"
              description: "Its extraction lag was within 5 minutes of its setting for only 0% of the last hour, burning the 99% objective more than 14.4 times too fast. See the Batch steps panel of Heartbeat Service for where the time goes."
          - exp_labels: {severity: warning, collector: c, environment: e, target: down, log_type: error}
            exp_annotations:
              summary: "OutSystems log type error of down is often behind"
              description: "Its extraction lag was within 5 minutes of its setting for only 0% of the last hour, burning the 99% objective more than 14.4 times too fast. See the Batch steps panel of Heartbeat Service for where the time goes."
      - eval_time: 400m
        alertname: HeartbeatExtractionFreshnessBurnSlow
        exp_alerts:
          - exp_labels: {severity: warning, collector: c, environment: e, target: behind, log_type: error}
            exp_annotations:
              summary: "OutSystems log type error of behind is behind too often"
              description: "Its extraction lag was within 5 minutes of its setting for only 0% of the last 6 hours, burning the 99% objective more than 6 times too fast."
          - exp_labels: {severity: warning, collector: c, environment: e, target: down, log_type: error}
            exp_annotations:
              summary: "OutSystems log type error of down is behind too often"
              description: "Its extraction lag was within 5 minutes of its setting for only 0% of the last 6 hours, burning the 99% objective more than 6 times too fast."

  - name: A collector with long intervals does not page on one late cycle; a busy one burns slowly too
    interval: 1m
    input_series:
      # sparse: one cycle every 5 minutes, one of them late.
      - series: 'heartbeat_collector_cycles_total{collector="sparse",outcome="on_time"}'
        values: '0x9 1x4 2x4 3x4 4x4 5x4 6x4 7x4 8x4 9x4 10x4 11x4 12x4'
      - series: 'heartbeat_collector_cycles_total{collector="sparse",outcome="late"}'
        values: '0x59 1x10'
      # busy: 4 cycles a minute, 5% late, for 400 minutes.
      - series: 'heartbeat_collector_cycles_total{collector="busy",outcome="on_time"}'
        values: '0+3.8x400'
      - series: 'heartbeat_collector_cycles_total{collector="busy",outcome="late"}'
        values: '0+0.2x400'
    alert_rule_test:
      - eval_time: 62m
        alertname: HeartbeatCollectorCyclesLateFast
        exp_alerts: []
      - eval_time: 400m
        alertname: HeartbeatCollectorCyclesLate
        exp_alerts:
          - exp_labels: {severity: warning, collector: busy}
            exp_annotations:
              summary: "The busy collector's cycles often run late"
              description: "5% of its cycles over the last 6 hours used their whole interval or panicked, more than 6 times the 0.5% budget."

  - name: API errors page; the health endpoints and low traffic do not
    interval: 1m
    input_series:
      # 60 requests a minute, 5% failing.
      - series: 'heartbeat_api_http_requests_total{route="/api/v1/applications",method="GET",code="200"}'
        values: '0+57x400'
      - series: 'heartbeat_api_http_requests_total{route="/api/v1/applications",method="GET",code="500"}'
        values: '0+3x400'
      # /readyz fails on purpose while a dependency is down.
      - series: 'heartbeat_api_http_requests_total{route="/readyz",method="GET",code="503"}'
        values: '0+600x90'
    promql_expr_test:
      - expr: heartbeat:api_request_errors:ratio_rate1h
        eval_time: 70m
        exp_samples:
          - labels: 'heartbeat:api_request_errors:ratio_rate1h'
            value: 0.05
    alert_rule_test:
      - eval_time: 70m
        alertname: HeartbeatAPIErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "The Heartbeat API is burning its error budget fast"
              description: "5% of API requests failed over the last hour, more than 14.4 times the 0.1% budget."
      - eval_time: 400m
        alertname: HeartbeatAPIErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The Heartbeat API is burning its error budget"
              description: "5% of API requests failed over the last 6 hours, more than 6 times the 0.1% budget."

  - name: A few failed API requests do not page
    interval: 1m
    input_series:
      # 3 requests a minute, half failing: under the 5 a minute the alert needs.
      - series: 'heartbeat_api_http_requests_total{route="/api/v1/applications",method="GET",code="200"}'
        values: '0+1.5x90'
      - series: 'heartbeat_api_http_requests_total{route="/api/v1/applications",method="GET",code="500"}'
        values: '0+1.5x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: HeartbeatAPIErrorBudgetBurnFast
        exp_alerts: []

  - name: The API's slow requests count against 250 ms, without the health endpoints
    interval: 1m
    input_series:
      - series: 'heartbeat_api_http_request_duration_seconds_bucket{route="/api/v1/applications",method="GET",le="0.25"}'
        values: '0+10x90'
      - series: 'heartbeat_api_http_request_duration_seconds_count{route="/api/v1/applications",method="GET"}'
        values: '0+100x90'
      - series: 'heartbeat_api_http_requests_total{route="/api/v1/applications",method="GET",code="200"}'
        values: '0+100x90'
    promql_expr_test:
      - expr: heartbeat:api_request_slow:ratio_rate1h
        eval_time: 70m
        exp_samples:
          - labels: 'heartbeat:api_request_slow:ratio_rate1h'
            value: 0.9
    alert_rule_test:
      - eval_time: 70m
        alertname: HeartbeatAPISlow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The Heartbeat API is slow"
              description: "90% of API requests took more than 250 ms over the last hour; the objective is at most 5%."

  - name: A restart loop, high memory, dropped logs and rejected exports alert
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="db-collector",instance="looping"}'
        values: '100 100 200 200 300 300 400 400 500 500'
      - series: 'process_start_time_seconds{job="db-collector",instance="stable"}'
        values: '100x9'
      - series: 'process_resident_memory_bytes{job="db-collector",instance="big"}'
        values: '300x30'
      - series: 'go_gc_gomemlimit_bytes{job="db-collector",instance="big"}'
        values: '200x30'
      - series: 'process_resident_memory_bytes{job="db-collector",instance="ok"}'
        values: '100x30'
      - series: 'go_gc_gomemlimit_bytes{job="db-collector",instance="ok"}'
        values: '200x30'
      - series: 'heartbeat_otlp_export_attempts_total{job="db-collector",instance="i",client="outsystems",outcome="rejected"}'
        values: '0 0 0 3 3 3'
    alert_rule_test:
      - eval_time: 9m
        alertname: HeartbeatServiceRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              job: db-collector
              instance: looping
            exp_annotations:
              summary: "db-collector looping restarted 4 times in an hour"
              description: "The process keeps restarting: an out-of-memory kill, a panic or a failing liveness probe. `kubectl describe pod` gives the reason, and `kubectl logs --previous` holds what it wrote last, which never reached Loki."
      - eval_time: 20m
        alertname: HeartbeatServiceMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: db-collector
              instance: big
            exp_annotations:
              summary: "db-collector big uses more memory than its GOMEMLIMIT"
              description: "Resident memory has stayed above the soft limit, so the garbage collector works hard and an out-of-memory kill may follow. Take a heap profile through HEARTBEAT_PPROF_ADDR, or raise the memory limit."
      - eval_time: 5m
        alertname: HeartbeatOTLPExportRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              job: db-collector
              instance: i
              client: outsystems
            exp_annotations:
              summary: "The OTel Collector rejected outsystems requests from db-collector"
              description: "A status retrying cannot fix: a wrong endpoint or path, or a request the Collector refuses. For outsystems, the batch is read again; for audit, the records stay in the outbox and are sent again. The status is in the service's log."

  - name: Dropped own logs alert, exported ones do not; growing goroutines alert
    interval: 1m
    input_series:
      - series: 'heartbeat_telemetry_log_records_total{job="db-collector",instance="i",outcome="dropped_queue_full"}'
        values: '0 0 0 15 15 15'
      - series: 'heartbeat_telemetry_log_records_total{job="db-collector",instance="i",outcome="exported"}'
        values: '0 100 200 300 400 500'
      # 250 goroutines, 1 more a minute: 60 an hour.
      - series: 'go_goroutines{job="db-collector",instance="leaking"}'
        values: '250+1x480'
      - series: 'go_goroutines{job="db-collector",instance="steady"}'
        values: '250x480'
    alert_rule_test:
      - eval_time: 5m
        alertname: HeartbeatOwnLogsDropped
        exp_alerts:
          - exp_labels: {severity: warning, job: db-collector, instance: i}
            exp_annotations:
              summary: "db-collector i dropped about 15 of its own log records"
              description: "They did not reach the OTel Collector, which is down or slow, or the service logs faster than it sends. They are still in `kubectl logs` until the pod goes. The Export attempts panel of Heartbeat Service says how they end."
      - eval_time: 480m
        alertname: HeartbeatGoroutinesGrowing
        exp_alerts:
          - exp_labels: {severity: warning, job: db-collector, instance: leaking}
            exp_annotations:
              summary: "db-collector leaking keeps adding goroutines"
              description: "More than 20 goroutines an hour over the last 6 hours, without having stopped: a likely leak. Take a goroutine profile through HEARTBEAT_PPROF_ADDR."

  - name: Audit delivery stalled alerts after 4 minutes of waiting, once, whatever the replicas
    interval: 1m
    input_series:
      # Two replicas report the same outbox. The oldest record waits from
      # minute 1 to minute 8, when the Collector takes it.
      - series: 'heartbeat_api_audit_outbox_oldest_age_seconds{job="api",instance="a"}'
        values: '0 0 60 120 180 240 300 360 420 0 0'
      - series: 'heartbeat_api_audit_outbox_oldest_age_seconds{job="api",instance="b"}'
        values: '0 0 60 120 180 240 300 360 420 0 0'
    alert_rule_test:
      # Above 120 s from minute 4; pending for 2 minutes.
      - eval_time: 5m
        alertname: HeartbeatAuditDeliveryStalled
        exp_alerts: []
      - eval_time: 6m
        alertname: HeartbeatAuditDeliveryStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Audit records have waited 5m 0s for the OTel Collector"
              description: "The oldest audit record in the API's outbox is older than 2 minutes: the API cannot hand records to the OTel Collector, so they are not in Loki yet. Changes still commit and no record is lost; they are delivered once the Collector takes them again. Check that HEARTBEAT_API_AUDIT_ENDPOINT is set (the API logs `audit delivery off` at startup when it is not), HeartbeatServiceDown for the OTel Collector and Loki, and `audit: delivery failed` in the API's log for the reason. heartbeat_api_audit_outbox_rows says how many wait."
      - eval_time: 10m
        alertname: HeartbeatAuditDeliveryStalled
        exp_alerts: []

  - name: Audit records that wait 3 minutes, as through a Collector restart, do not alert
    interval: 1m
    input_series:
      - series: 'heartbeat_api_audit_outbox_oldest_age_seconds{job="api",instance="a"}'
        values: '0 60 120 180 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: HeartbeatAuditDeliveryStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: HeartbeatAuditDeliveryStalled
        exp_alerts: []
