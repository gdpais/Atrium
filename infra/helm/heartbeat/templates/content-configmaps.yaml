{{- if .Values.prometheusRules.enabled }}
{{- /* An optional alert lives in a file of its own, left out when it is off.
The missing-collector alert needs the db-collector, scraped by the bundled
Prometheus as job db-collector, the name its absent() matches
(heartbeat-collector-missing.rules.yml); a job_name override renames it. The
missing-API alert is the same for the API and job api. */}}
{{- $collectorJob := get (.Values.prometheus.scrapeConfigs | default dict) "db-collector" | default dict }}
{{- $collectorScraped := and .Values.dbCollector.enabled (include "heartbeat.prometheusScrapes" (dict "root" . "job" "db-collector")) (eq (dig "job_name" "db-collector" $collectorJob) "db-collector") }}
{{- $apiJob := get (.Values.prometheus.scrapeConfigs | default dict) "api" | default dict }}
{{- $apiScraped := and .Values.api.enabled (include "heartbeat.prometheusScrapes" (dict "root" . "job" "api")) (eq (dig "job_name" "api" $apiJob) "api") }}
{{- $optionalRules := dict
  "heartbeat-config-reload.rules.yml" (dig "configReloadAlert" "enabled" true .Values.prometheusRules)
  "heartbeat-collector-missing.rules.yml" $collectorScraped
  "heartbeat-api-missing.rules.yml" $apiScraped }}
# Rule files from files/prometheus/rules (and generated/). Prometheus mounts this
# ConfigMap at /etc/prometheus-rules; its config reloader reloads on changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartbeat-prometheus-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus-rules
data:
  {{- range $path, $_ := .Files.Glob "files/prometheus/rules/*.yml" }}
  {{- if dig (base $path) true $optionalRules }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- range $path, $_ := .Files.Glob "files/prometheus/rules/generated/*.yml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.grafanaDashboards.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartbeat-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboards
    # Discovery label for Grafana's dashboard sidecar in shared Grafanas.
    grafana_dashboard: "1"
data:
  {{- range $path, $_ := .Files.Glob "files/grafana/dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
