{{- if .Values.dbCollector.enabled }}
{{- $c := .Values.dbCollector }}
{{- $sel := dict "root" $ "component" "db-collector" }}
# A one-replica StatefulSet gives at-most-one collector during node partitions:
# the replacement pod is not created until the old one is confirmed gone, so
# the same SQL targets are never polled twice. The replica count is fixed at 1
# until replicas can share targets safely (ADR 0003).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.componentLabels" $sel | nindent 4 }}
spec:
  replicas: 1
  serviceName: db-collector-headless
  # Parallel, not OrderedReady: with OrderedReady the controller never replaces
  # a pod that did not become Ready (kubernetes/kubernetes#67250), so after a
  # bad image or config the corrected upgrade waits forever for it. With one
  # replica there is no order to keep; the pod name still keeps the old and
  # new pod from running at once. The field cannot change on an existing
  # StatefulSet, so an install made with OrderedReady (chart 0.1.0) deletes
  # the StatefulSet once with --cascade=orphan before it upgrades
  # (docs/guides/install-from-release.md#upgrade); scripts/kind.sh does that
  # for kind.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "heartbeat.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heartbeat.componentLabels" $sel | nindent 8 }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # No config checksum annotation: the collector hot-reloads integrations.yaml,
      # and a ConfigMap change must not restart it.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: db-collector
          image: {{ include "heartbeat.image" (dict "root" $ "image" $c.image) | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          env:
            - name: HEARTBEAT_DB_COLLECTOR_LISTEN_ADDR
              value: ":8082"
            - name: HEARTBEAT_INTEGRATIONS_PATH
              value: /app/config/integrations.yaml
            - name: HEARTBEAT_CONFIG_WATCH_INTERVAL
              value: {{ $c.configWatchInterval | quote }}
            - name: HEARTBEAT_DB_COLLECTOR_SQLSERVER_TRUST_SERVER_CERTIFICATE
              value: {{ $c.sqlserver.trustServerCertificate | quote }}
            - name: HEARTBEAT_STATE_DIR
              value: /var/lib/heartbeat
            {{- if $c.credentials.existingSecret }}
            # Credential files are read on every connection, so a key added to
            # or rotated in the Secret is used once the kubelet updates the
            # volume (about a minute), without a restart.
            - name: HEARTBEAT_CREDENTIALS_DIR
              value: /var/run/secrets/heartbeat/credentials
            {{- end }}
            {{- if $c.adminTLS.existingSecret }}
            # The admin endpoints leave port 8082 for their own HTTPS port.
            - name: HEARTBEAT_DB_COLLECTOR_ADMIN_LISTEN_ADDR
              value: ":{{ $c.adminTLS.port }}"
            - name: HEARTBEAT_DB_COLLECTOR_ADMIN_TLS_CERT_FILE
              value: /var/run/secrets/heartbeat/admin-tls/tls.crt
            - name: HEARTBEAT_DB_COLLECTOR_ADMIN_TLS_KEY_FILE
              value: /var/run/secrets/heartbeat/admin-tls/tls.key
            {{- end }}
            {{- if $c.otlpExporter.headers.existingSecret }}
            - name: HEARTBEAT_OTLP_HEADERS_DIR
              value: /var/run/secrets/heartbeat/otlp-headers
            {{- end }}
            {{- if $c.otlpExporter.tls.ca.existingSecret }}
            - name: HEARTBEAT_OTLP_CA_FILE
              value: /var/run/secrets/heartbeat/otlp-ca/ca.crt
            {{- end }}
            {{- if $c.otlpExporter.tls.clientCert.existingSecret }}
            - name: HEARTBEAT_OTLP_CLIENT_CERT_FILE
              value: /var/run/secrets/heartbeat/otlp-client/tls.crt
            - name: HEARTBEAT_OTLP_CLIENT_KEY_FILE
              value: /var/run/secrets/heartbeat/otlp-client/tls.key
            {{- end }}
            {{- if $c.adminToken.existingSecret }}
            - name: HEARTBEAT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.adminToken.existingSecret }}
                  key: {{ $c.adminToken.key }}
            {{- end }}
            {{- with $c.goMemLimit | default (include "heartbeat.goMemLimit" (dict "limit" (dig "limits" "memory" "" $c.resources) "name" "dbCollector")) }}
            # Go's soft memory limit, below the container limit: the collector
            # collects garbage harder instead of being OOM-killed mid-batch.
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with include "heartbeat.telemetryEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8082
            {{- if $c.adminTLS.existingSecret }}
            - name: admin
              containerPort: {{ $c.adminTLS.port }}
            {{- end }}
          # Liveness only checks the process: a monitored database outage must
          # never restart the collector. Readiness reports whether the
          # collectors are actually cycling (reasons in GET /admin/config).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # A directory mount (not subPath) so ConfigMap updates reach the pod.
            - name: config
              mountPath: /app/config
              readOnly: true
            # The only writable path: the root filesystem stays read-only.
            - name: state
              mountPath: /var/lib/heartbeat
            {{- if $c.credentials.existingSecret }}
            # A directory mount (not subPath) so Secret updates reach the pod.
            - name: credentials
              mountPath: /var/run/secrets/heartbeat/credentials
              readOnly: true
            {{- end }}
            {{- if $c.adminTLS.existingSecret }}
            - name: admin-tls
              mountPath: /var/run/secrets/heartbeat/admin-tls
              readOnly: true
            {{- end }}
            {{- if $c.otlpExporter.headers.existingSecret }}
            - name: otlp-headers
              mountPath: /var/run/secrets/heartbeat/otlp-headers
              readOnly: true
            {{- end }}
            {{- if $c.otlpExporter.tls.ca.existingSecret }}
            - name: otlp-ca
              mountPath: /var/run/secrets/heartbeat/otlp-ca
              readOnly: true
            {{- end }}
            {{- if $c.otlpExporter.tls.clientCert.existingSecret }}
            - name: otlp-client
              mountPath: /var/run/secrets/heartbeat/otlp-client
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "heartbeat.integrationsConfigMap" . }}
        {{- with $c.credentials.existingSecret }}
        - name: credentials
          secret:
            secretName: {{ . }}
            # Readable by the pod's fsGroup only.
            defaultMode: 0440
        {{- end }}
        {{- with $c.adminTLS.existingSecret }}
        - name: admin-tls
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- with $c.otlpExporter.headers.existingSecret }}
        - name: otlp-headers
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
        {{- with $c.otlpExporter.tls.ca }}
        {{- if .existingSecret }}
        - name: otlp-ca
          secret:
            secretName: {{ .existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .key }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- with $c.otlpExporter.tls.clientCert.existingSecret }}
        - name: otlp-client
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        - name: state
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: db-collector-state
          {{- else }}
          emptyDir:
            sizeLimit: {{ $c.persistence.size }}
          {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $c.persistence.enabled }}
---
# The outsystems_logs watermarks. A plain claim rather than a
# volumeClaimTemplate: the collector is a single replica, and a template could
# never change on an existing StatefulSet. ReadWriteOnce is enough, because
# the StatefulSet stops the old pod before it starts the new one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-collector-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.componentLabels" $sel | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $c.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
{{- end }}
---
# Governing Service for the StatefulSet and Prometheus' scrape target. It
# publishes the pod while unready, so Prometheus keeps scraping the collector's
# own failure metrics when no target is healthy.
apiVersion: v1
kind: Service
metadata:
  name: db-collector-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.componentLabels" $sel | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "heartbeat.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: 8082
      targetPort: http
---
# Operator access (health, admin endpoints). Routes to the pod only when ready.
apiVersion: v1
kind: Service
metadata:
  name: db-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.componentLabels" $sel | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "heartbeat.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      {{- if and (eq $c.service.type "NodePort") $c.service.nodePort }}
      nodePort: {{ $c.service.nodePort }}
      {{- end }}
    {{- if $c.adminTLS.existingSecret }}
    - name: admin
      port: {{ $c.adminTLS.port }}
      targetPort: admin
    {{- end }}
  {{- if and (has $c.service.type (list "NodePort" "LoadBalancer")) $c.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $c.service.externalTrafficPolicy }}
  {{- end }}
{{- end }}
