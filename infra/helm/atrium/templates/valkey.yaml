{{- if .Values.valkey.enabled }}
{{- $v := .Values.valkey }}
{{- $sel := dict "root" $ "component" "valkey" }}
# Valkey, the Redis server, for kind and CI (ADR 0015): one replica. Nothing
# in it is a record. Production uses Amazon ElastiCache.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atrium.componentLabels" $sel | nindent 4 }}
spec:
  replicas: 1
  serviceName: valkey
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "atrium.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atrium.componentLabels" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # The image's valkey user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ printf "%s:%s" $v.image.repository $v.image.tag | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          # The configuration, password included, reaches valkey-server on
          # standard input ("-"), never its command line, which any process
          # on the node can read. exec keeps valkey-server as PID 1, so it
          # receives SIGTERM and shuts down cleanly.
          command:
            - sh
            - -c
            - |
              exec valkey-server - <<EOF
              requirepass "$VALKEYCLI_AUTH"
              bind * -::*
              port 6379
              dir /data
              maxmemory {{ $v.maxmemory }}
              maxmemory-policy noeviction
              {{- if $v.persistence.enabled }}
              appendonly yes
              {{- else }}
              appendonly no
              {{- end }}
              save ""
              EOF
          env:
            # The password, read by the configuration above and by valkey-cli
            # in the readiness probe, so neither puts it on a command line.
            - name: VALKEYCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ $v.auth.existingSecret }}
                  key: {{ $v.auth.passwordKey }}
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep -qx PONG"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if $v.persistence.enabled }}
          persistentVolumeClaim:
            claimName: valkey-data
          {{- else }}
          emptyDir:
            sizeLimit: {{ $v.persistence.size }}
          {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $v.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atrium.componentLabels" $sel | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $v.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atrium.componentLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "atrium.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
{{- if $v.networkPolicy.enabled }}
{{- $peers := list }}
{{- if .Values.api.enabled }}
{{- $peers = append $peers (include "atrium.enginePeer" (dict "root" $ "engine" "api") | fromYaml) }}
{{- end }}
{{- $peers = concat $peers $v.networkPolicy.extraPeers }}
---
# Only the API (and, when they exist, the workers) and extraPeers may reach
# port 6379 (ADR 0015).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atrium.componentLabels" $sel | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atrium.selectorLabels" $sel | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if $peers }}
  ingress:
    - ports:
        - protocol: TCP
          port: 6379
      from:
        {{- toYaml $peers | nindent 8 }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
