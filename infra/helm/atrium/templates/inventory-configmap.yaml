{{- /* The environment's inventory file (ADR 0021), as api.inventory holds
it, unchanged: the API checks it as `api inventory check` does, and a file
that fails changes nothing. */}}
{{- if and .Values.api.enabled .Values.api.inventory }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atrium.inventoryConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atrium.componentLabels" (dict "root" $ "component" "api") | nindent 4 }}
data:
  inventory.yaml: |
    {{- .Values.api.inventory | nindent 4 }}
{{- end }}
