# Used only by opt-in integration tests, each with a unique --project-name.
# No host ports or durable volumes: never share the developer database.
services:
  postgres:
    # The newest major Amazon RDS supports, and the chart's postgresql
    # (ADR 0015; tests/chart_engines_test.go).
    image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    environment:
      POSTGRES_DB: atrium
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium-test-only
    # postgres 18 keeps its data under /var/lib/postgresql/18/docker and
    # refuses to start with a mount at /var/lib/postgresql/data.
    tmpfs:
      - /var/lib/postgresql
    # The test process that started the project, set by the tests: a later
    # test process removes the project once that one is gone, if it died
    # before its cleanup (internal/testreap).
    labels:
      atrium.test.host: ${ATRIUM_TEST_HOST:-}
      atrium.test.pid: ${ATRIUM_TEST_PID:-}
    volumes:
      - ../db/migrations:/migrations:ro
    # Over TCP: while initdb runs, the entrypoint starts a temporary server
    # on the Unix socket only, then stops it and starts the real one. A
    # check over the socket can pass on the temporary server and let the
    # tests in before the real one is up (as testenv's does, internal/testenv).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U atrium -d atrium"]
      interval: 1s
      timeout: 5s
      retries: 60
