# Used only by opt-in integration tests, each with a unique --project-name.
# No host ports or durable volumes: never share the developer database.
services:
  postgres:
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_DB: heartbeat
      POSTGRES_USER: heartbeat
      POSTGRES_PASSWORD: heartbeat-test-only
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbeat -d heartbeat"]
      interval: 1s
      timeout: 5s
      retries: 60
