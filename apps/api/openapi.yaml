# The API's contract (ADR 0013), written by hand and reviewed like code.
# `make generate` writes the server types in internal/openapi from it, and
# `make test` fails when they differ. Keep to plain OpenAPI 3.1 constructs
# (`type: [T, "null"]`, `oneOf` enums): oapi-codegen's 3.1 support is new.
openapi: 3.1.0
info:
  title: Heartbeat API
  # The contract's major version, the /api/v1 prefix of the resource
  # operations. Changes within it are additive; a breaking change is v2.
  version: v1
  description: |
    Heartbeat's control plane. The resource operations live under
    `/api/v1`; the health endpoints stay outside it. `GET /metrics`
    (Prometheus exposition) is served beside this contract and not described
    here.

    **Who may call what.** Every operation declares it with `security`:
    `[]` for one that needs no login, or the `session` scheme with the least
    role it needs. Roles rank `viewer` < `operator` < `admin`, and a user
    may call what any of their roles allows. An operation that declares
    nothing gets the top-level requirement, `admin`, and a test fails on it.

    **Unsafe methods** (POST, PUT, PATCH, DELETE) need an `Origin` header
    equal to the site the API is configured for; any other is refused with
    403, before the operation runs.

    **Errors** are `application/problem+json` (RFC 9457).
servers:
  - url: /
security:
  - session: [admin]
tags:
  - name: health
    description: Probes for Kubernetes. They need no login and say nothing about why.
  - name: session
    description: Logging in and out with a local user's email and password (ADR 0013 §7–8).
  - name: users
    description: |
      Local users and their roles (ADR 0013 §7–8), for admins; and each
      user's own password. A user is disabled, never deleted. Disabling a
      user or setting their password ends every session they have. The
      last active admin can be neither disabled nor stripped of `admin`.
      Every change is audited (ADR 0016), never with a password or a hash.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      security: []
      description: |
        200 while the process serves HTTP. It checks no dependency, so a
        PostgreSQL or Redis outage never restarts the pod; readiness takes it
        out of its Service instead.
      responses:
        "200":
          description: The process serves HTTP.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      security: []
      description: |
        200 when every dependency the API needs to serve requests works, 503
        otherwise, and 503 too once the API is shutting down, so that it
        leaves its Service before it stops accepting connections. The body
        carries only the status; which dependency failed and why is logged.
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency the API needs does not work, or the API is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/session:
    post:
      operationId: createSession
      tags: [session]
      summary: Log in
      security: []
      description: |
        Checks the email and password and starts a session: the response
        sets the session cookie, which the browser then sends with every
        request. A wrong password, an unknown email and a disabled user get
        the same 401, so the answer does not tell which. Failed attempts are
        limited per account and per client address; past the limit the API
        answers 429 without checking the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie, `__Host-heartbeat_session`, HttpOnly, Secure, SameSite=Lax, Path=/.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many failed attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getSession
      tags: [session]
      summary: Who is logged in
      security:
        - session: [viewer]
      description: The session the cookie belongs to, and its user.
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [session]
      summary: Log out
      security:
        - session: [viewer]
      description: Ends the session and clears its cookie.
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/account/password:
    put:
      operationId: changeOwnPassword
      tags: [users]
      summary: Change your own password
      security:
        - session: [viewer]
      description: |
        Sets a new password for the session's user, given the current one.
        Every session of the user ends, this one included, so the response
        clears the cookie: log in again with the new password. A wrong
        current password counts against the same limits as a failed login,
        and past them the answer is 429 without checking it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed; every session of the user has ended.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current password is wrong, or the `Origin` header is not the configured site.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyFailures"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      security:
        - session: [admin]
      description: |
        Every user, by email. Not paged: an organisation has tens of
        users, not thousands.
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      security:
        - session: [admin]
      description: |
        Creates an active user with a password and at least one role. The
        password is stored only as its argon2id hash, and neither appears
        in logs or audit records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      security:
        - session: [admin]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a user
      security:
        - session: [admin]
      description: |
        Changes the fields the body holds and keeps the others. Disabling a
        user ends every session they have; the last active admin cannot be
        disabled (409). A body that changes nothing is answered with the
        user as they are, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setUserPassword
      tags: [users]
      summary: Set a user's password
      security:
        - session: [admin]
      description: |
        Replaces the user's password, as when they have forgotten it, and
        ends every session they have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          description: Set; every session of the user has ended.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: role
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Role"
    put:
      operationId: grantRole
      tags: [users]
      summary: Grant a role
      security:
        - session: [admin]
      description: |
        Gives the user the role. Granting one they have changes nothing,
        and audits nothing. Their next request has it.
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeRole
      tags: [users]
      summary: Revoke a role
      security:
        - session: [admin]
      description: |
        Takes the role from the user. Revoking one they do not have changes
        nothing, and audits nothing. `admin` cannot be taken from the last
        active admin (409). Their next request goes without it.
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-heartbeat_session
      description: |
        The cookie `POST /api/v1/session` sets. Its value is a random 256-bit
        ID; the API keeps only its SHA-256 hash, in Redis. A session ends
        after 8 hours without a request or 7 days after login, whichever
        comes first (both configurable), at logout, and when its user is
        disabled.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatusFilter:
      name: status
      in: query
      description: Only the active, or only the disabled, ones.
      schema:
        $ref: "#/components/schemas/Status"
  headers:
    Location:
      description: The new entity's path, such as `/api/v1/users/{id}`.
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is not one the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session, or for a login, wrong credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The `Origin` header is not the configured site, or the user's roles do not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No entity has this ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        The change conflicts with what exists: another user already has the
        email, or the change would leave no active admin. The detail says
        which.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyFailures:
      description: Too many failed attempts for this account or from this address.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: The API could not serve the request, such as when PostgreSQL or Redis does not answer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          examples: [admin@example.com]
        password:
          type: string
          description: At most 1024 bytes.
    Role:
      type: string
      description: "`viewer` reads (wallboards), `operator` changes inventory and probes, `admin` everything, users and roles included."
      enum: [viewer, operator, admin]
    Session:
      type: object
      additionalProperties: false
      required: [id, user, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifies the session in audit records. It is not the cookie and cannot be used to log in.
        user:
          $ref: "#/components/schemas/SessionUser"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the session ends however active it is; without requests it ends sooner.
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Status:
      type: string
      description: "`disabled` keeps the entity and its history but takes it out of use. Disabling an environment does not change its applications' status."
      enum: [active, disabled]
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, roles, last_login_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: The login, in lower case; unique whatever its case.
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    Email:
      type: string
      description: A bare address such as `alice@example.com`, stored in lower case.
      maxLength: 254
    DisplayName:
      type: string
      description: Leading and trailing spaces are dropped; then at most 200 characters, without control characters.
      maxLength: 200
    Password:
      type: string
      description: 15 characters to 1,024 bytes of UTF-8. Stored only as its argon2id hash.
      minLength: 15
      maxLength: 1024
    NewUser:
      type: object
      additionalProperties: false
      required: [email, password, roles]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        password:
          $ref: "#/components/schemas/Password"
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
    UserUpdate:
      type: object
      additionalProperties: false
      description: The fields to change. Roles and the password have their own operations.
      properties:
        email:
          $ref: "#/components/schemas/Email"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        status:
          $ref: "#/components/schemas/Status"
    NewPassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/Password"
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The password the user logs in with now.
        new_password:
          $ref: "#/components/schemas/Password"
    Problem:
      type: object
      description: An error, as RFC 9457 describes it.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: "`about:blank`: the status says what went wrong."
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
