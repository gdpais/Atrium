# The API's contract (ADR 0013), written by hand and reviewed like code.
# `make generate` writes the server types in internal/openapi from it, and
# `make test` fails when they differ. Keep to plain OpenAPI 3.1 constructs
# (`type: [T, "null"]`, `oneOf` enums): oapi-codegen's 3.1 support is new.
openapi: 3.1.0
info:
  title: Heartbeat API
  # The contract's major version, the /api/v1 prefix of the resource
  # operations. Changes within it are additive; a breaking change is v2.
  version: v1
  description: |
    Heartbeat's control plane. The resource operations live under
    `/api/v1`; the health endpoints stay outside it. `GET /metrics`
    (Prometheus exposition) is served beside this contract and not described
    here.

    **Who may call what.** Every operation declares it with `security`:
    `[]` for one that needs no login, or the `session` scheme with the least
    role it needs. Roles rank `viewer` < `operator` < `admin`, and a user
    may call what any of their roles allows. An operation that declares
    nothing gets the top-level requirement, `admin`, and a test fails on it.

    **Unsafe methods** (POST, PUT, PATCH, DELETE) need an `Origin` header
    equal to the site the API is configured for; any other is refused with
    403, before the operation runs.

    **Errors** are `application/problem+json` (RFC 9457).
servers:
  - url: /
security:
  - session: [admin]
tags:
  - name: health
    description: Probes for Kubernetes. They need no login and say nothing about why.
  - name: session
    description: Logging in and out with a local user's email and password (ADR 0013 §7–8).
  - name: probe-definitions
    description: |
      What a probe assignment runs against a database target (TODO 4.5).
      Built-in definitions are the db-collector's catalog and read-only;
      custom ones replace a built-in's query and are versioned. Anyone
      logged in reads them; only admins change them, since they carry SQL
      that runs on monitored databases.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      security: []
      description: |
        200 while the process serves HTTP. It checks no dependency, so a
        PostgreSQL or Redis outage never restarts the pod; readiness takes it
        out of its Service instead.
      responses:
        "200":
          description: The process serves HTTP.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      security: []
      description: |
        200 when every dependency the API needs to serve requests works, 503
        otherwise, and 503 too once the API is shutting down, so that it
        leaves its Service before it stops accepting connections. The body
        carries only the status; which dependency failed and why is logged.
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency the API needs does not work, or the API is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/session:
    post:
      operationId: createSession
      tags: [session]
      summary: Log in
      security: []
      description: |
        Checks the email and password and starts a session: the response
        sets the session cookie, which the browser then sends with every
        request. A wrong password, an unknown email and a disabled user get
        the same 401, so the answer does not tell which. Failed attempts are
        limited per account and per client address; past the limit the API
        answers 429 without checking the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie, `__Host-heartbeat_session`, HttpOnly, Secure, SameSite=Lax, Path=/.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many failed attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getSession
      tags: [session]
      summary: Who is logged in
      security:
        - session: [viewer]
      description: The session the cookie belongs to, and its user.
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [session]
      summary: Log out
      security:
        - session: [viewer]
      description: Ends the session and clears its cookie.
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-definitions:
    get:
      operationId: listProbeDefinitions
      tags: [probe-definitions]
      summary: List probe definitions
      security:
        - session: [viewer]
      description: The latest version of every definition, built-in and custom, sorted by engine and name.
      responses:
        "200":
          description: The definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinitionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProbeDefinition
      tags: [probe-definitions]
      summary: Create a custom probe definition
      security:
        - session: [admin]
      description: |
        Stores version 1 of a custom definition. Its `query_template` must
        be one read-only `SELECT`, checked as the db-collector checks it when
        it loads its configuration, and `overrides` must name an enabled
        built-in probe of the same engine. Review the query with the
        [probe review checklist](https://gdpais.github.io/Heartbeat/architecture/database-observability.html#probe-review-checklist)
        before it runs on a shared or production target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProbeDefinition"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The new version's URL.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-definitions/{id}:
    parameters:
      - $ref: "#/components/parameters/ProbeDefinitionID"
    get:
      operationId: getProbeDefinition
      tags: [probe-definitions]
      summary: Get a probe definition version
      security:
        - session: [viewer]
      description: One version, the latest or an older one an assignment pins.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProbeDefinition
      tags: [probe-definitions]
      summary: Enable or disable a custom probe definition
      security:
        - session: [admin]
      description: |
        Disables, or enables again, the custom definition this is a version
        of: every version of it. Definitions are disabled, never deleted,
        since assignments may pin their versions. Built-in definitions are
        read-only (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeDefinitionPatch"
      responses:
        "200":
          description: The version, as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-definitions/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ProbeDefinitionID"
    get:
      operationId: listProbeDefinitionVersions
      tags: [probe-definitions]
      summary: List a probe definition's versions
      security:
        - session: [viewer]
      description: Every version of the definition this is a version of, the newest first.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinitionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProbeDefinitionVersion
      tags: [probe-definitions]
      summary: Change a custom probe definition
      security:
        - session: [admin]
      description: |
        Adds the next version of the custom definition whose latest version
        this is, holding the request's content: a version is the whole
        content, so a field left out takes its default, not the previous
        version's value. The query is checked as on creation. Older versions
        stay as they were, for the assignments that pin them.

        The path names the version the change starts from; when it is no
        longer the latest, because someone added a version since it was
        read, the change is refused (409), so no change is lost. Content
        equal to that version's adds nothing (200). Built-in and disabled
        definitions get no versions (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeDefinitionContent"
      responses:
        "201":
          description: The new version.
          headers:
            Location:
              description: The new version's URL.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "200":
          description: Nothing changed; the version the path names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-heartbeat_session
      description: |
        The cookie `POST /api/v1/session` sets. Its value is a random 256-bit
        ID; the API keeps only its SHA-256 hash, in Redis. A session ends
        after 8 hours without a request or 7 days after login, whichever
        comes first (both configurable), at logout, and when its user is
        disabled.
  parameters:
    ProbeDefinitionID:
      name: id
      in: path
      required: true
      description: A version's ID.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is not one the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session, or for a login, wrong credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The `Origin` header is not the configured site, or the user's roles do not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource's current state does not allow the change.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: The API could not serve the request, such as when PostgreSQL or Redis does not answer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          examples: [admin@example.com]
        password:
          type: string
          description: At most 1024 bytes.
    Role:
      type: string
      description: "`viewer` reads (wallboards), `operator` changes inventory and probes, `admin` everything, users and roles included."
      enum: [viewer, operator, admin]
    Session:
      type: object
      additionalProperties: false
      required: [id, user, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifies the session in audit records. It is not the cookie and cannot be used to log in.
        user:
          $ref: "#/components/schemas/SessionUser"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the session ends however active it is; without requests it ends sooner.
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    ProbeEngine:
      type: string
      description: The kind of collector that runs the probe.
      enum: [sqlserver]
    ProbeDefinition:
      type: object
      additionalProperties: false
      required: [id, engine, name, version, builtin, overrides, category, description, default_interval_seconds, timeout_ms, query_template, enabled, latest, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: This version's ID; an assignment pins it.
        engine:
          $ref: "#/components/schemas/ProbeEngine"
        name:
          type: string
          description: Unique per engine across built-in and custom definitions.
        version:
          type: integer
          minimum: 1
        builtin:
          type: boolean
          description: A probe of the db-collector's catalog, read-only.
        overrides:
          type: [string, "null"]
          description: The built-in probe whose query a custom definition replaces; null for a built-in.
        category:
          type: string
          description: The overridden built-in's category, for a custom definition.
        description:
          type: string
        default_interval_seconds:
          type: integer
        timeout_ms:
          type: [integer, "null"]
          description: Null for the collector's default, half the interval, at most 10 s.
        query_template:
          type: [string, "null"]
          description: Null for a built-in, which runs the collector's own query.
        enabled:
          type: boolean
          description: The definition's, the same for all its versions.
        latest:
          type: boolean
          description: Whether this is the definition's highest version.
        created_at:
          type: string
          format: date-time
          description: When this version was stored.
        updated_at:
          type: string
          format: date-time
          description: When it was last enabled or disabled, or stored.
    ProbeDefinitionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProbeDefinition"
    NewProbeDefinition:
      type: object
      required: [engine, name, overrides, query_template]
      properties:
        engine:
          $ref: "#/components/schemas/ProbeEngine"
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          description: Lower-case letters, digits and underscores, starting with a letter; it cannot change.
          examples: [waits_without_hadr]
        overrides:
          type: string
          description: |
            The built-in probe whose query this one replaces, such as
            `waits`. Its metric descriptors decode the rows, so the query
            must return the same columns, in the same units. A target runs
            one definition per built-in probe.
          examples: [waits]
        query_template:
          type: string
          maxLength: 16384
          description: One read-only T-SQL `SELECT`, optionally led by `WITH`; at most 16 KiB.
        description:
          type: string
          maxLength: 1000
          description: Why the override exists, for its reviewers. Defaults to empty.
        default_interval_seconds:
          type: integer
          minimum: 5
          maximum: 3600
          description: The interval an assignment gets unless it sets one. Defaults to 30, the collector's default scrape interval.
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 25000
          description: The longest one run may take. Left out, the collector's default applies; half the interval, at most 10 s.
    ProbeDefinitionContent:
      type: object
      required: [overrides, query_template]
      properties:
        overrides:
          type: string
          description: |
            The built-in probe whose query this one replaces, such as
            `waits`. Its metric descriptors decode the rows, so the query
            must return the same columns, in the same units. A target runs
            one definition per built-in probe.
          examples: [waits]
        query_template:
          type: string
          maxLength: 16384
          description: One read-only T-SQL `SELECT`, optionally led by `WITH`; at most 16 KiB.
        description:
          type: string
          maxLength: 1000
          description: Why the override exists, for its reviewers. Defaults to empty.
        default_interval_seconds:
          type: integer
          minimum: 5
          maximum: 3600
          description: The interval an assignment gets unless it sets one. Defaults to 30, the collector's default scrape interval.
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 25000
          description: The longest one run may take. Left out, the collector's default applies; half the interval, at most 10 s.
    ProbeDefinitionPatch:
      type: object
      description: The fields to change; `enabled` is the only one.
      minProperties: 1
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: "`false` disables the definition, `true` enables it again."
    Problem:
      type: object
      description: An error, as RFC 9457 describes it.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: "`about:blank`: the status says what went wrong."
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
