          format: date-time
        updated_at:
          type: string
          format: date-time
    ComponentType:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,62}$"
      description: What part of the application it is, such as `module`, `screen_flow` or `worker`. Lower-case letters, digits and underscores, starting with a letter; at most 63. Unique with the name within an application.
      examples: [module]
    NewComponent:
      type: object
      additionalProperties: false
      required: [application_id, name, component_type]
      properties:
        application_id:
