            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      security:
        - session: [admin]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a user
      security:
        - session: [admin]
      description: |
        Changes the fields the body holds and keeps the others. Disabling a
        user ends every session they have; the last active admin cannot be
        disabled (409). A body that changes nothing is answered with the
        user as they are, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setUserPassword
      tags: [users]
      summary: Set a user's password
      security:
        - session: [admin]
      description: |
        Replaces the user's password, as when they have forgotten it, and
        ends every session they have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          description: Set; every session of the user has ended.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: role
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Role"
    put:
      operationId: grantRole
      tags: [users]
      summary: Grant a role
      security:
        - session: [admin]
      description: |
        Gives the user the role. Granting one they have changes nothing,
        and audits nothing. Their next request has it.
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeRole
      tags: [users]
      summary: Revoke a role
      security:
        - session: [admin]
      description: |
        Takes the role from the user. Revoking one they do not have changes
        nothing, and audits nothing. `admin` cannot be taken from the last
        active admin, nor their only role from any user (409): disable them
        instead. Their next request goes without it.
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-heartbeat_session
      description: |
        The cookie `POST /api/v1/session` sets. Its value is a random 256-bit
        ID; the API keeps only its SHA-256 hash, in Redis. A session ends
        after 8 hours without a request or 7 days after login, whichever
        comes first (both configurable), at logout, and when its user is
        disabled.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatusFilter:
      name: status
      in: query
      description: Only the active, or only the disabled, ones.
      schema:
        $ref: "#/components/schemas/Status"
    Limit:
      name: limit
      in: query
      description: The most items a page holds; 50 when left out.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Cursor:
      name: cursor
      in: query
      description: Where the page starts; the `next_cursor` of the page before. Left out, the first page.
      schema:
        type: string
        maxLength: 2048
    ProbeDefinitionID:
      name: id
      in: path
      required: true
      description: A version's ID.
      schema:
        type: string
        format: uuid
  headers:
    Location:
      description: The new entity's path, such as `/api/v1/environments/{id}`.
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is not one the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session, or for a login, wrong credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The `Origin` header is not the configured site, or the user's roles do not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No entity has this ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        The change conflicts with what exists: another entity already has
        the name, slug or email; a delete is refused because other entities
        still refer to this one; for a probe definition, it is built-in or
        disabled, or the version is no longer the latest; or the change would
        leave no active admin, or a user without a role. The detail says
        which.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NoOwner:
      description: The body names an environment or application that does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyFailures:
      description: Too many failed attempts for this account or from this address.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: The API could not serve the request, such as when PostgreSQL or Redis does not answer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          examples: [admin@example.com]
        password:
          type: string
          description: At most 1024 bytes.
    Role:
      type: string
      description: "`viewer` reads (wallboards), `operator` changes inventory and probes, `admin` everything, users and roles included."
      enum: [viewer, operator, admin]
    Session:
      type: object
      additionalProperties: false
      required: [id, user, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifies the session in audit records. It is not the cookie and cannot be used to log in.
        user:
          $ref: "#/components/schemas/SessionUser"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the session ends however active it is; without requests it ends sooner.
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Status:
      type: string
      description: "`disabled` keeps the entity and its history but takes it out of use. Disabling an environment does not change its applications' status."
      enum: [active, disabled]
    EnvironmentType:
      type: string
      enum: [production, staging, development, test]
    Criticality:
      type: string
      enum: [low, medium, high, critical]
    Name:
      type: string
      description: Leading and trailing spaces are dropped; then 1 to 200 characters, without control characters.
      minLength: 1
      maxLength: 200
    Slug:
      type: string
      description: |
        The environment as the collectors and the telemetry name it: each
        collector's `environment` setting, the `environment` label of
        Heartbeat's metrics and the `deployment.environment.name` of logs
        (ADR 0017 §2). Lower-case letters, digits and hyphens, 1 to 63,
        starting and ending with a letter or a digit, so that it works as a
        label value, in a URL and as a Kubernetes name. Unique, and fixed
        once created.
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      examples: [prod]
    Labels:
      type: object
      description: At most 64 labels; keys of 1 to 63 characters, values of at most 256, without control characters. A change replaces them all.
      additionalProperties:
        type: string
        maxLength: 256
      maxProperties: 64
    Environment:
      type: object
      additionalProperties: false
      required: [id, name, slug, type, description, status, labels, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        slug:
          $ref: "#/components/schemas/Slug"
        type:
          $ref: "#/components/schemas/EnvironmentType"
        description:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewEnvironment:
      type: object
      additionalProperties: false
      required: [name, slug, type]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        slug:
          $ref: "#/components/schemas/Slug"
        type:
          $ref: "#/components/schemas/EnvironmentType"
        description:
          type: string
          description: At most 2000 characters; empty when left out.
          maxLength: 2000
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
    EnvironmentUpdate:
      type: object
      additionalProperties: false
      description: The fields to change; the slug cannot.
      properties:
        name:
          $ref: "#/components/schemas/Name"
        type:
          $ref: "#/components/schemas/EnvironmentType"
        description:
          type: string
          maxLength: 2000
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
    EnvironmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
    Application:
      type: object
      additionalProperties: false
      required: [id, environment_id, name, platform, owner_team, criticality, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
          description: The environment it belongs to, fixed when it was created.
        name:
          $ref: "#/components/schemas/Name"
        platform:
          $ref: "#/components/schemas/Platform"
        owner_team:
          type: string
        criticality:
          $ref: "#/components/schemas/Criticality"
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Platform:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,62}$"
      description: What the application runs on, such as `outsystems_traditional`, `outsystems_reactive` or `dotnet`. Lower-case letters, digits and underscores, starting with a letter; at most 63.
      examples: [outsystems_traditional]
    NewApplication:
      type: object
      additionalProperties: false
      required: [environment_id, name, platform]
      properties:
        environment_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        platform:
          $ref: "#/components/schemas/Platform"
        owner_team:
          type: string
          description: At most 200 characters; empty when left out.
          maxLength: 200
        criticality:
          $ref: "#/components/schemas/Criticality"
        status:
          $ref: "#/components/schemas/Status"
    ApplicationUpdate:
      type: object
      additionalProperties: false
      description: The fields to change; the environment cannot.
      properties:
        name:
          $ref: "#/components/schemas/Name"
        platform:
          $ref: "#/components/schemas/Platform"
        owner_team:
          type: string
          maxLength: 200
        criticality:
          $ref: "#/components/schemas/Criticality"
        status:
          $ref: "#/components/schemas/Status"
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        next_cursor:
          type: string
          description: The `cursor` of the next page; absent on the last.
    Component:
      type: object
      additionalProperties: false
      required: [id, application_id, environment_id, name, component_type, runtime_name, labels, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
          description: The application it belongs to, fixed when it was created.
        environment_id:
          type: string
          format: uuid
          description: Its application's environment, read through the application; a component has none of its own.
        name:
          $ref: "#/components/schemas/Name"
        component_type:
          $ref: "#/components/schemas/ComponentType"
        runtime_name:
          type: string
        labels:
          $ref: "#/components/schemas/Labels"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ComponentType:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,62}$"
      description: What part of the application it is, such as `module`, `screen_flow` or `worker`. Lower-case letters, digits and underscores, starting with a letter; at most 63. Unique with the name within an application.
      examples: [module]
    NewComponent:
      type: object
      additionalProperties: false
      required: [application_id, name, component_type]
      properties:
        application_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        component_type:
          $ref: "#/components/schemas/ComponentType"
        runtime_name:
          type: string
          description: What the telemetry calls it, such as an OutSystems module's `Module_Name`; at most 200 characters, empty when left out.
          maxLength: 200
        labels:
          $ref: "#/components/schemas/Labels"
    ComponentUpdate:
      type: object
      additionalProperties: false
      description: The fields to change; the application cannot.
      properties:
        name:
          $ref: "#/components/schemas/Name"
        component_type:
          $ref: "#/components/schemas/ComponentType"
        runtime_name:
          type: string
          maxLength: 200
        labels:
          $ref: "#/components/schemas/Labels"
    ComponentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Component"
        next_cursor:
          type: string
          description: The `cursor` of the next page; absent on the last.
    SourceType:
      type: string
      description: The kind of source, which says what `config` holds (one JSON Schema per type in `packages/config-schema/src/telemetry-sources`).
      enum: [outsystems]
    IngestMode:
      type: string
      description: "How its telemetry arrives: `agentless`, read from the platform by a Heartbeat collector (OutSystems 11 self-managed), or `otlp`, sent by the platform (OutSystems Cloud and ODC). `file` and `api` are in the schema for later types; an `outsystems` source takes `agentless` or `otlp`."
      enum: [otlp, file, api, agentless]
    SourceConfig:
      type: object
      description: |
        The source type's settings, valid against its JSON Schema. For
        `outsystems`: `{"application_name": "Claims"}`, the OutSystems
        `Application_Name`, which is the `service.name` of the application's
        logs. Never a credential: a schema names one only as a reference,
        such as `env/finance-prod`.
      additionalProperties: true
      examples:
        - application_name: Claims
    Observation:
      type: object
      additionalProperties: false
      required: [status, collectors]
      description: Whether the DB collector observes the source, as its redacted `GET /admin/config` says when the source is read.
      properties:
        status:
          type: string
          description: "`observed`: an enabled collector extracts the source's environment; `not_observed`: the collector answered, and none does; `unknown`: the collector could not be asked; `not_applicable`: no Heartbeat collector reads this kind of source (an `otlp` source sends its telemetry itself)."
          enum: [observed, not_observed, unknown, not_applicable]
        collectors:
          type: array
          description: The IDs of the collectors that extract it.
          items:
            type: string
        checked_at:
          type: string
          format: date-time
          description: When the collector answered; absent when it did not.
        detail:
          type: string
          description: Why the source is not observed, or why that is unknown.
    TelemetrySource:
      type: object
      additionalProperties: false
      required: [id, application_id, environment_id, source_type, ingest_mode, status, config, observation, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
          description: The application it belongs to, fixed when it was registered.
        environment_id:
          type: string
          format: uuid
          description: Its application's environment, read through the application; a source has none of its own.
        source_type:
          $ref: "#/components/schemas/SourceType"
        ingest_mode:
          $ref: "#/components/schemas/IngestMode"
        status:
          $ref: "#/components/schemas/Status"
        config:
          $ref: "#/components/schemas/SourceConfig"
        observation:
          $ref: "#/components/schemas/Observation"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewTelemetrySource:
      type: object
      additionalProperties: false
      required: [application_id, source_type, ingest_mode, config]
      properties:
        application_id:
          type: string
          format: uuid
        source_type:
          $ref: "#/components/schemas/SourceType"
        ingest_mode:
          $ref: "#/components/schemas/IngestMode"
        status:
          $ref: "#/components/schemas/Status"
        config:
          $ref: "#/components/schemas/SourceConfig"
    TelemetrySourceUpdate:
      type: object
      additionalProperties: false
      description: The fields to change; the application and the source type cannot.
      properties:
        ingest_mode:
          $ref: "#/components/schemas/IngestMode"
        status:
          $ref: "#/components/schemas/Status"
        config:
          $ref: "#/components/schemas/SourceConfig"
    TelemetrySourcePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TelemetrySource"
        next_cursor:
          type: string
          description: The `cursor` of the next page; absent on the last.
    DatabaseEngine:
      type: string
      description: The database's engine, which the collector of the same kind monitors.
      enum: [sqlserver]
    TargetName:
      type: string
      description: |
        The `target` label of the target's metrics, beside the
        environment's. Lower-case letters, digits and hyphens, 1 to 63,
        starting and ending with a letter or a digit. Unique in its
        environment, and fixed once created.
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      examples: [finance-prod]
    Host:
      type: string
      description: |
        A host name, an IPv4 address or a bare IPv6 address, as the
        collector accepts it: no port, brackets, credentials or path. At
        most 253 characters; stored in lower case.
      minLength: 1
      maxLength: 253
      examples: [sql01.finance.internal]
    Port:
      type: integer
      minimum: 1
      maximum: 65535
    DatabaseName:
      type: string
      description: The database to connect to; empty for the login's default. At most 128 characters, without control characters.
      maxLength: 128
    CredentialRef:
      type: string
      description: |
        A reference to the credential the collector logs in with, never
        the credential: `kv/`, `secret/` or `env/` and a name of lower-case
        letters, digits and `-`, at most 200, so that each key has one
        spelling. The collector reads the
        `username:password` from the key `HEARTBEAT_CREDENTIAL_<REF>` of
        its mounted credentials Secret, the reference upper-cased with `/`,
        `-` and `.` as `_` (`env/finance-prod` is
        `HEARTBEAT_CREDENTIAL_ENV_FINANCE_PROD`).
      pattern: "^(kv|secret|env)/[a-z0-9][a-z0-9-]{0,199}$"
      examples: [env/finance-prod]
    DatabaseTarget:
      type: object
      additionalProperties: false
      required: [id, environment_id, engine, name, host, port, database_name, credential_ref, status, labels, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
          description: The environment it belongs to, fixed when it was created.
        engine:
          $ref: "#/components/schemas/DatabaseEngine"
        name:
          $ref: "#/components/schemas/TargetName"
        host:
          $ref: "#/components/schemas/Host"
        port:
          $ref: "#/components/schemas/Port"
        database_name:
          $ref: "#/components/schemas/DatabaseName"
        credential_ref:
          $ref: "#/components/schemas/CredentialRef"
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewDatabaseTarget:
      type: object
      additionalProperties: false
      required: [environment_id, name, host, credential_ref]
      properties:
        environment_id:
          type: string
          format: uuid
        engine:
          $ref: "#/components/schemas/DatabaseEngine"
        name:
          $ref: "#/components/schemas/TargetName"
        host:
          $ref: "#/components/schemas/Host"
        port:
          allOf:
            - $ref: "#/components/schemas/Port"
          description: Defaults to the engine's, 1433 for SQL Server.
        database_name:
          $ref: "#/components/schemas/DatabaseName"
        credential_ref:
          $ref: "#/components/schemas/CredentialRef"
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
    DatabaseTargetUpdate:
      type: object
      additionalProperties: false
      description: The fields to change; the environment, engine and name cannot.
      properties:
        host:
          $ref: "#/components/schemas/Host"
        port:
          $ref: "#/components/schemas/Port"
        database_name:
          $ref: "#/components/schemas/DatabaseName"
        credential_ref:
          $ref: "#/components/schemas/CredentialRef"
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
    DatabaseTargetPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseTarget"
        next_cursor:
          type: string
          description: The `cursor` of the next page; absent on the last.
    ProbeEngine:
      type: string
      description: The kind of collector that runs the probe.
      enum: [sqlserver]
    ProbeDefinition:
      type: object
      additionalProperties: false
      required: [id, engine, name, version, builtin, overrides, category, description, default_interval_seconds, timeout_ms, query_template, enabled, latest, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: This version's ID; an assignment pins it.
        engine:
          $ref: "#/components/schemas/ProbeEngine"
        name:
          type: string
          description: Unique per engine across built-in and custom definitions.
        version:
          type: integer
          minimum: 1
        builtin:
          type: boolean
          description: A probe of the db-collector's catalog, read-only.
        overrides:
          type: [string, "null"]
          description: The built-in probe whose query a custom definition replaces; null for a built-in.
        category:
          type: string
          description: The overridden built-in's category, for a custom definition.
        description:
          type: string
        default_interval_seconds:
          type: integer
        timeout_ms:
          type: [integer, "null"]
          description: Null for the collector's default, half the interval, at most 10 s.
        query_template:
          type: [string, "null"]
          description: Null for a built-in, which runs the collector's own query.
        enabled:
          type: boolean
          description: The definition's, the same for all its versions.
        latest:
          type: boolean
          description: Whether this is the definition's highest version.
        created_at:
          type: string
          format: date-time
          description: When this version was stored.
        updated_at:
          type: string
          format: date-time
          description: When it was last enabled or disabled, or stored.
    ProbeDefinitionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProbeDefinition"
    NewProbeDefinition:
      type: object
      additionalProperties: false
      required: [engine, name, overrides, query_template]
      properties:
        engine:
          $ref: "#/components/schemas/ProbeEngine"
        name:
          type: string
          pattern: "^custom_[a-z0-9][a-z0-9_]{0,55}$"
          description: |
            `custom_` and then lower-case letters, digits and underscores, at
            most 63 characters in all. No built-in's name starts with
            `custom_`, so one added to the collector later never clashes
            with a custom definition. It cannot change.
          examples: [custom_waits_lean]
        overrides:
          type: string
          description: |
            The built-in probe whose query this one replaces, such as
            `waits`. Its metric descriptors decode the rows, so the query
            must return the same columns, in the same units, and the
            definition takes its category. It cannot change: every version
            overrides the same built-in. A target runs one definition per
            built-in probe.
          examples: [waits]
        query_template:
          type: string
          maxLength: 16384
          description: One read-only T-SQL `SELECT`, optionally led by `WITH`; at most 16 KiB of UTF-8, counted in bytes.
        description:
          type: string
          maxLength: 1000
          description: Why the override exists, for its reviewers. Defaults to empty.
        default_interval_seconds:
          type: integer
          minimum: 5
          maximum: 3600
          description: The interval an assignment gets unless it sets one. Defaults to 30, the collector's default scrape interval.
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 25000
          description: The longest one run may take. Left out, the collector's default applies; half the interval, at most 10 s.
    ProbeDefinitionContent:
      type: object
      additionalProperties: false
      description: A version's content. The engine, name and `overrides` stay the definition's.
      required: [query_template]
      properties:
        query_template:
          type: string
          maxLength: 16384
          description: One read-only T-SQL `SELECT`, optionally led by `WITH`; at most 16 KiB of UTF-8, counted in bytes.
        description:
          type: string
          maxLength: 1000
          description: Why the override exists, for its reviewers. Defaults to empty.
        default_interval_seconds:
          type: integer
          minimum: 5
          maximum: 3600
          description: The interval an assignment gets unless it sets one. Defaults to 30, the collector's default scrape interval.
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 25000
          description: The longest one run may take. Left out, the collector's default applies; half the interval, at most 10 s.
    ProbeDefinitionPatch:
      type: object
      description: The fields to change; `enabled` is the only one.
      minProperties: 1
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: "`false` disables the definition, `true` enables it again."
    AssignmentState:
      type: string
      description: |
        Where an assignment is in its approval (ADR 0014 §4). `draft`:
        created or changed, not rendered. `approved`: rendered into
        `managedCollectors`. `proposed`: in an open pull request to the
        config repository. `applied`: the collector runs it as rendered.
        `rejected`: refused, not rendered. `failed`: the config repository's
        checks or the collector refused it. `proposed` and `failed` come
        with the pull request output; until then an assignment goes
        `draft` → `approved` → `applied`, or `draft` → `rejected`.
      enum: [draft, approved, proposed, applied, rejected, failed]
    ProbeAssignment:
      type: object
      additionalProperties: false
      required: [id, database_target_id, probe_definition_id, interval_seconds, timeout_ms, max_rows, enabled, state, state_detail, pull_request_url, approved_by, approved_at, created_by, collector_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        database_target_id:
          type: string
          format: uuid
          description: The target it runs against, for good.
        probe_definition_id:
          type: string
          format: uuid
          description: The definition version it runs, pinned.
        interval_seconds:
          type: integer
        timeout_ms:
          type: [integer, "null"]
          description: Null for the definition's timeout, or else the collector's, half the interval, at most 10 s.
        max_rows:
          type: [integer, "null"]
          description: Null for the collector's row limit, 10000.
        enabled:
          type: boolean
        state:
          $ref: "#/components/schemas/AssignmentState"
        state_detail:
          type: string
          description: Why it was rejected or failed; empty otherwise.
        pull_request_url:
          type: [string, "null"]
          description: The pull request that proposes it; null with the output `none`.
        approved_by:
          type: [string, "null"]
          format: uuid
          description: The user who approved it; null while it is a draft or rejected.
        approved_at:
          type: [string, "null"]
          format: date-time
        created_by:
          type: [string, "null"]
          format: uuid
        collector_id:
          type: string
          description: The collector it renders to, `api-<target id>-<interval>s`, as the collector's metrics and admin config name it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProbeAssignmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProbeAssignment"
        next_cursor:
          type: string
          description: The `cursor` of the next page; absent on the last.
    AssignmentInterval:
      type: integer
      minimum: 5
      maximum: 3600
      description: |
        Seconds between runs: the scrape_interval of the target's collector.
        A target runs at one interval, so all its approved assignments share
        it.
    AssignmentTimeout:
      type: integer
      minimum: 0
      maximum: 25000
      description: The longest one run may take, at most the interval; 0 leaves it to the definition, and then to the collector.
    AssignmentMaxRows:
      type: integer
      minimum: 0
      maximum: 100000
      description: The most rows one run may return, or the run fails; 0 leaves it to the collector, 10000.
    NewProbeAssignment:
      type: object
      additionalProperties: false
      required: [database_target_id, probe_definition_id]
      properties:
        database_target_id:
          type: string
          format: uuid
        probe_definition_id:
          type: string
          format: uuid
          description: The definition version to run; any version of an enabled definition for the target's engine.
        interval_seconds:
          $ref: "#/components/schemas/AssignmentInterval"
        timeout_ms:
          $ref: "#/components/schemas/AssignmentTimeout"
        max_rows:
          $ref: "#/components/schemas/AssignmentMaxRows"
        enabled:
          type: boolean
          description: Defaults to true.
    ProbeAssignmentUpdate:
      type: object
      additionalProperties: false
      description: The fields to change; the target cannot.
      properties:
        probe_definition_id:
          type: string
          format: uuid
          description: Another version of the same definition.
        interval_seconds:
          $ref: "#/components/schemas/AssignmentInterval"
        timeout_ms:
          $ref: "#/components/schemas/AssignmentTimeout"
        max_rows:
          $ref: "#/components/schemas/AssignmentMaxRows"
        enabled:
          type: boolean
    ProbeAssignmentRejection:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Why, for whoever changes it next. Defaults to empty.
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, roles, last_login_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: The login, in lower case; unique whatever its case.
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    Email:
      type: string
      description: A bare address such as `alice@example.com`, stored in lower case.
      maxLength: 254
    DisplayName:
      type: string
      description: Leading and trailing spaces are dropped; then at most 200 characters, without control characters.
      maxLength: 200
    Password:
      type: string
      description: 15 characters to 1,024 bytes of UTF-8. Stored only as its argon2id hash.
      minLength: 15
      maxLength: 1024
    NewUser:
      type: object
      additionalProperties: false
      required: [email, password, roles]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        password:
          $ref: "#/components/schemas/Password"
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
    UserUpdate:
      type: object
      additionalProperties: false
      description: The fields to change. Roles and the password have their own operations.
      properties:
        email:
          $ref: "#/components/schemas/Email"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        status:
          $ref: "#/components/schemas/Status"
    NewPassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/Password"
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The password the user logs in with now.
        new_password:
          $ref: "#/components/schemas/Password"
    Problem:
      type: object
      description: An error, as RFC 9457 describes it.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: "`about:blank`: the status says what went wrong."
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
