# The API's contract (ADR 0013), written by hand and reviewed like code.
# `make generate` writes the server types in internal/openapi from it, and
# `make test` fails when they differ. Keep to plain OpenAPI 3.1 constructs
# (`type: [T, "null"]`, `oneOf` enums): oapi-codegen's 3.1 support is new.
openapi: 3.1.0
info:
  title: Heartbeat API
  # The contract's major version, the /api/v1 prefix of the resource
  # operations. Changes within it are additive; a breaking change is v2.
  version: v1
  description: |
    Heartbeat's control plane. The resource operations live under
    `/api/v1`; the health endpoints stay outside it. `GET /metrics`
    (Prometheus exposition) is served beside this contract and not described
    here.

    **Who may call what.** Every operation declares it with `security`:
    `[]` for one that needs no login, or the `session` scheme with the least
    role it needs. Roles rank `viewer` < `operator` < `admin`, and a user
    may call what any of their roles allows. An operation that declares
    nothing gets the top-level requirement, `admin`, and a test fails on it.

    **Unsafe methods** (POST, PUT, PATCH, DELETE) need an `Origin` header
    equal to the site the API is configured for; any other is refused with
    403, before the operation runs.

    **Request bodies** are JSON objects with the fields their schema lists:
    a field the schema does not list is refused with 400, never ignored, so
    a client that tries to change what cannot change (an application's
    environment, an environment's slug) learns it did not.

    **Errors** are `application/problem+json` (RFC 9457).
servers:
  - url: /
security:
  - session: [admin]
tags:
  - name: health
    description: Probes for Kubernetes. They need no login and say nothing about why.
  - name: session
    description: Logging in and out with a local user's email and password (ADR 0013 §7–8).
  - name: inventory
    description: |
      Environments, their applications, and the applications' components
      (ADR 0001, ADR 0013 §2). Each application belongs to one environment,
      set when it is created and never changed; a component belongs to one
      application the same way, and its environment is its application's.
      Viewers read; operators create, change and delete. Every change is
      audited (ADR 0016). Disable rather than delete: a delete is refused
      with 409 while anything still refers to the entity.
  - name: telemetry-sources
    description: |
      Which telemetry is an application's own (ADR 0017). A source belongs
      to one application, for good, and its environment is the
      application's. Its `config` is checked against the JSON Schema of its
      `source_type` in `packages/config-schema/src/telemetry-sources`, and
      holds credential references only, never credentials. Within an
      environment, an `application_name` maps to one application. Each
      source says whether the DB collector observes it: an agentless
      OutSystems source is observed when an enabled `outsystems_logs`
      collector extracts its environment. Viewers read; operators create,
      change and delete. Every change is audited.
  - name: database-targets
    description: |
      Monitored databases (TODO 4.5). Each belongs to one environment, set
      when it is created and never changed, and holds a credential
      reference, never a credential: the db-collector resolves it from its
      own mounted Secret (ADR 0014 §6). The API never connects to a target
      (ADR 0013 §1); whether one is reachable is the collector's to report,
      once a probe assignment renders it. Viewers read; operators create,
      change and delete. Every change is audited (ADR 0016).
  - name: probe-definitions
    description: |
      What a probe assignment runs against a database target (TODO 4.5).
      Built-in definitions are the db-collector's catalog and read-only;
      custom ones replace a built-in's query and are versioned. Anyone
      logged in reads them; only admins change them, since they carry SQL
      that runs on monitored databases.
  - name: probe-assignments
    description: |
      A probe definition version run against a database target, at an
      interval (TODO 4.5, ADR 0014). An assignment is created as a draft;
      an admin approves it, and the API renders every approved one into the
      values file that holds the chart's `managedCollectors`. The API never
      writes cluster state: the file reaches the collector through a pull
      request to the config repository, or on kind through
      `make kind-assignments`. An assignment is applied once the collector
      runs it as rendered, which the API checks in the collector's
      `GET /admin/config`. Viewers read; operators create, change and
      delete; admins approve and reject. Every change is audited.
  - name: users
    description: |
      Local users and their roles (ADR 0013 §7–8), for admins; and each
      user's own password. A user is disabled, never deleted. Disabling a
      user or setting their password ends every session they have. The
      last active admin can be neither disabled nor stripped of `admin`.
      Every change is audited (ADR 0016), never with a password or a hash.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      security: []
      description: |
        200 while the process serves HTTP. It checks no dependency, so a
        PostgreSQL or Redis outage never restarts the pod; readiness takes it
        out of its Service instead.
      responses:
        "200":
          description: The process serves HTTP.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      security: []
      description: |
        200 when every dependency the API needs to serve requests works, 503
        otherwise, and 503 too once the API is shutting down, so that it
        leaves its Service before it stops accepting connections. The body
        carries only the status; which dependency failed and why is logged.
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency the API needs does not work, or the API is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/session:
    post:
      operationId: createSession
      tags: [session]
      summary: Log in
      security: []
      description: |
        Checks the email and password and starts a session: the response
        sets the session cookie, which the browser then sends with every
        request. A wrong password, an unknown email and a disabled user get
        the same 401, so the answer does not tell which. Failed attempts are
        limited per account and per client address; past the limit the API
        answers 429 without checking the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie, `__Host-heartbeat_session`, HttpOnly, Secure, SameSite=Lax, Path=/.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many failed attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getSession
      tags: [session]
      summary: Who is logged in
      security:
        - session: [viewer]
      description: The session the cookie belongs to, and its user.
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [session]
      summary: Log out
      security:
        - session: [viewer]
      description: Ends the session and clears its cookie.
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/environments:
    get:
      operationId: listEnvironments
      tags: [inventory]
      summary: List environments
      security:
        - session: [viewer]
      description: |
        Every environment, by name. Not paged: an organisation runs a
        handful of environments, not thousands.
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: The environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createEnvironment
      tags: [inventory]
      summary: Create an environment
      security:
        - session: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEnvironment"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/environments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnvironment
      tags: [inventory]
      summary: Get an environment
      security:
        - session: [viewer]
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateEnvironment
      tags: [inventory]
      summary: Change an environment
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others. The slug
        cannot change: it is how the collectors and the telemetry name the
        environment. A body that changes nothing is answered with the
        environment as it is, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentUpdate"
      responses:
        "200":
          description: The environment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEnvironment
      tags: [inventory]
      summary: Delete an environment
      security:
        - session: [operator]
      description: |
        Deletes an environment nothing refers to. While it has
        applications, database targets or investigations the answer is
        409, and nothing is deleted: disable it instead
        (`PATCH` with `status: disabled`).
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/applications:
    get:
      operationId: listApplications
      tags: [inventory]
      summary: List applications
      security:
        - session: [viewer]
      description: |
        Applications by name, a page at a time: an installation can hold
        hundreds. Filter by environment to list one environment's.
      parameters:
        - name: environment_id
          in: query
          description: Only the applications of this environment.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApplication
      tags: [inventory]
      summary: Create an application
      security:
        - session: [operator]
      description: |
        Creates an application in the environment the body names, which
        it belongs to for good: the same system in another environment is
        another application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApplication"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/NoOwner"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getApplication
      tags: [inventory]
      summary: Get an application
      security:
        - session: [viewer]
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateApplication
      tags: [inventory]
      summary: Change an application
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others. Its
        environment cannot change. A body that changes nothing is answered
        with the application as it is, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: The application after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteApplication
      tags: [inventory]
      summary: Delete an application
      security:
        - session: [operator]
      description: |
        Deletes an application nothing refers to. While it has components,
        telemetry sources, investigations, alert policies, notification
        routes, alert events or reports the answer is 409, and nothing is
        deleted: disable it instead (`PATCH` with `status: disabled`). Its
        adaptive baselines, computed from its telemetry, are deleted with
        it.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/components:
    get:
      operationId: listComponents
      tags: [inventory]
      summary: List application components
      security:
        - session: [viewer]
      description: Components by name, a page at a time; filter by application to list one application's.
      parameters:
        - name: application_id
          in: query
          description: Only the components of this application.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of components.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createComponent
      tags: [inventory]
      summary: Create an application component
      security:
        - session: [operator]
      description: |
        Creates a component of the application the body names, which it
        belongs to for good. Its environment is the application's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewComponent"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/NoOwner"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/components/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getComponent
      tags: [inventory]
      summary: Get an application component
      security:
        - session: [viewer]
      responses:
        "200":
          description: The component.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateComponent
      tags: [inventory]
      summary: Change an application component
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others. Its
        application cannot change. A body that changes nothing is answered
        with the component as it is, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentUpdate"
      responses:
        "200":
          description: The component after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteComponent
      tags: [inventory]
      summary: Delete an application component
      security:
        - session: [operator]
      description: |
        Components have no status to disable, so they are deleted. Nothing
        refers to them yet; once something does, a delete while it does is
        refused with 409, as for environments and applications.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/telemetry-sources:
    get:
      operationId: listTelemetrySources
      tags: [telemetry-sources]
      summary: List telemetry sources
      security:
        - session: [viewer]
      description: |
        Sources by `application_name`, a page at a time, each with its
        observation. The collector is asked once per page at most, and its
        answer is kept for 15 seconds.
      parameters:
        - name: application_id
          in: query
          description: Only the sources of this application.
          schema:
            type: string
            format: uuid
        - name: environment_id
          in: query
          description: Only the sources of this environment's applications.
          schema:
            type: string
            format: uuid
        - name: source_type
          in: query
          schema:
            $ref: "#/components/schemas/SourceType"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySourcePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTelemetrySource
      tags: [telemetry-sources]
      summary: Register a telemetry source
      security:
        - session: [operator]
      description: |
        Registers a source for the application the body names, which it
        belongs to for good. A source can be registered before its
        extraction is set up: its observation then says it is not observed,
        and nothing is refused for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTelemetrySource"
      responses:
        "201":
          description: Registered.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/NoOwner"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/telemetry-sources/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTelemetrySource
      tags: [telemetry-sources]
      summary: Get a telemetry source
      security:
        - session: [viewer]
      responses:
        "200":
          description: The source and its observation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTelemetrySource
      tags: [telemetry-sources]
      summary: Change a telemetry source
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others; `config` is
        replaced whole and checked again. Its application and source type
        cannot change. A body that changes nothing is answered with the
        source as it is, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetrySourceUpdate"
      responses:
        "200":
