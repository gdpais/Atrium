        name:
          $ref: "#/components/schemas/Name"
        platform:
          $ref: "#/components/schemas/Platform"
        owner_team:
          type: string
        criticality:
          $ref: "#/components/schemas/Criticality"
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Platform:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,62}$"
      description: What the application runs on, such as `outsystems_traditional`, `outsystems_reactive` or `dotnet`. Lower-case letters, digits and underscores, starting with a letter; at most 63.
      examples: [outsystems_traditional]
    NewApplication:
      type: object
      additionalProperties: false
      required: [environment_id, name, platform]
      properties:
        environment_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        platform:
          $ref: "#/components/schemas/Platform"
        owner_team:
          type: string
          description: At most 200 characters; empty when left out.
          maxLength: 200
        criticality:
          $ref: "#/components/schemas/Criticality"
        status:
          $ref: "#/components/schemas/Status"
    ApplicationUpdate:
      type: object
