# The API's contract (ADR 0013), written by hand and reviewed like code.
# `make generate` writes the server types in internal/openapi from it, and
# `make test` fails when they differ. Keep to plain OpenAPI 3.1 constructs
# (`type: [T, "null"]`, `oneOf` enums): oapi-codegen's 3.1 support is new.
openapi: 3.1.0
info:
  title: Heartbeat API
  # The contract's major version, the /api/v1 prefix of the resource
  # operations. Changes within it are additive; a breaking change is v2.
  version: v1
  description: |
    Heartbeat's control plane. The resource operations live under
    `/api/v1`; the health endpoints stay outside it. `GET /metrics`
    (Prometheus exposition) is served beside this contract and not described
    here.

    **Who may call what.** Every operation declares it with `security`:
    `[]` for one that needs no login, or the `session` scheme with the least
    role it needs. Roles rank `viewer` < `operator` < `admin`, and a user
    may call what any of their roles allows. An operation that declares
    nothing gets the top-level requirement, `admin`, and a test fails on it.

    **Unsafe methods** (POST, PUT, PATCH, DELETE) need an `Origin` header
    equal to the site the API is configured for; any other is refused with
    403, before the operation runs.

    **Request bodies** are JSON objects with the fields their schema lists:
    a field the schema does not list is refused with 400, never ignored, so
    a client that tries to change what cannot change (an application's
    environment, an environment's slug) learns it did not.

    **Errors** are `application/problem+json` (RFC 9457).
servers:
  - url: /
security:
  - session: [admin]
tags:
  - name: health
    description: Probes for Kubernetes. They need no login and say nothing about why.
  - name: session
    description: Logging in and out with a local user's email and password (ADR 0013 §7–8).
  - name: inventory
    description: |
      Environments, their applications, and the applications' components
      (ADR 0001, ADR 0013 §2). Each application belongs to one environment,
      set when it is created and never changed; a component belongs to one
      application the same way, and its environment is its application's.
      Viewers read; operators create, change and delete. Every change is
      audited (ADR 0016). Disable rather than delete: a delete is refused
      with 409 while anything still refers to the entity.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      security: []
      description: |
        200 while the process serves HTTP. It checks no dependency, so a
        PostgreSQL or Redis outage never restarts the pod; readiness takes it
        out of its Service instead.
      responses:
        "200":
          description: The process serves HTTP.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      security: []
      description: |
        200 when every dependency the API needs to serve requests works, 503
        otherwise, and 503 too once the API is shutting down, so that it
        leaves its Service before it stops accepting connections. The body
        carries only the status; which dependency failed and why is logged.
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency the API needs does not work, or the API is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/session:
    post:
      operationId: createSession
      tags: [session]
      summary: Log in
      security: []
      description: |
        Checks the email and password and starts a session: the response
        sets the session cookie, which the browser then sends with every
        request. A wrong password, an unknown email and a disabled user get
        the same 401, so the answer does not tell which. Failed attempts are
        limited per account and per client address; past the limit the API
        answers 429 without checking the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie, `__Host-heartbeat_session`, HttpOnly, Secure, SameSite=Lax, Path=/.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many failed attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getSession
      tags: [session]
      summary: Who is logged in
      security:
        - session: [viewer]
      description: The session the cookie belongs to, and its user.
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [session]
      summary: Log out
      security:
        - session: [viewer]
      description: Ends the session and clears its cookie.
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/environments:
    get:
      operationId: listEnvironments
      tags: [inventory]
      summary: List environments
      security:
        - session: [viewer]
      description: |
        Every environment, by name. Not paged: an organisation runs a
        handful of environments, not thousands.
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: The environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createEnvironment
      tags: [inventory]
      summary: Create an environment
      security:
        - session: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEnvironment"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/environments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnvironment
      tags: [inventory]
      summary: Get an environment
      security:
        - session: [viewer]
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateEnvironment
      tags: [inventory]
      summary: Change an environment
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others. The slug
        cannot change: it is how the collectors and the telemetry name the
        environment. A body that changes nothing is answered with the
        environment as it is, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentUpdate"
      responses:
        "200":
          description: The environment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEnvironment
      tags: [inventory]
      summary: Delete an environment
      security:
        - session: [operator]
      description: |
        Deletes an environment nothing refers to. While it has
        applications, database targets or investigations the answer is
        409, and nothing is deleted: disable it instead
        (`PATCH` with `status: disabled`).
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/applications:
    get:
      operationId: listApplications
      tags: [inventory]
      summary: List applications
      security:
        - session: [viewer]
      description: |
        Applications by name, a page at a time: an installation can hold
        hundreds. Filter by environment to list one environment's.
      parameters:
        - name: environment_id
          in: query
          description: Only the applications of this environment.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApplication
      tags: [inventory]
      summary: Create an application
      security:
        - session: [operator]
      description: |
        Creates an application in the environment the body names, which
        it belongs to for good: the same system in another environment is
        another application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApplication"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/NoOwner"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getApplication
      tags: [inventory]
      summary: Get an application
      security:
        - session: [viewer]
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateApplication
      tags: [inventory]
      summary: Change an application
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others. Its
        environment cannot change. A body that changes nothing is answered
        with the application as it is, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: The application after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteApplication
      tags: [inventory]
      summary: Delete an application
      security:
        - session: [operator]
      description: |
        Deletes an application nothing refers to. While it has components,
        telemetry sources, investigations, alert policies, notification
        routes, alert events or reports the answer is 409, and nothing is
        deleted: disable it instead (`PATCH` with `status: disabled`).
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/components:
    get:
      operationId: listComponents
      tags: [inventory]
      summary: List application components
      security:
        - session: [viewer]
      description: Components by name, a page at a time; filter by application to list one application's.
      parameters:
        - name: application_id
          in: query
          description: Only the components of this application.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of components.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createComponent
      tags: [inventory]
      summary: Create an application component
      security:
        - session: [operator]
      description: |
        Creates a component of the application the body names, which it
        belongs to for good. Its environment is the application's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewComponent"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/NoOwner"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/components/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getComponent
      tags: [inventory]
      summary: Get an application component
      security:
        - session: [viewer]
      responses:
        "200":
          description: The component.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateComponent
      tags: [inventory]
      summary: Change an application component
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others. Its
        application cannot change. A body that changes nothing is answered
        with the component as it is, and audits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentUpdate"
      responses:
        "200":
          description: The component after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteComponent
      tags: [inventory]
      summary: Delete an application component
      security:
        - session: [operator]
      description: Components have no status to disable, and nothing refers to them, so they are deleted.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-heartbeat_session
      description: |
        The cookie `POST /api/v1/session` sets. Its value is a random 256-bit
        ID; the API keeps only its SHA-256 hash, in Redis. A session ends
        after 8 hours without a request or 7 days after login, whichever
        comes first (both configurable), at logout, and when its user is
        disabled.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatusFilter:
      name: status
      in: query
      description: Only the active, or only the disabled, ones.
      schema:
        $ref: "#/components/schemas/Status"
    Limit:
      name: limit
      in: query
      description: The most items a page holds; 50 when left out.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Cursor:
      name: cursor
      in: query
      description: Where the page starts; the `next_cursor` of the page before. Left out, the first page.
      schema:
        type: string
        maxLength: 1024
  headers:
    Location:
      description: The new entity's path, such as `/api/v1/environments/{id}`.
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is not one the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session, or for a login, wrong credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The `Origin` header is not the configured site, or the user's roles do not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No entity has this ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        The change conflicts with what exists: another entity already has
        the name or slug, or a delete is refused because other entities
        still refer to this one. The detail says which.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NoOwner:
      description: The body names an environment or application that does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: The API could not serve the request, such as when PostgreSQL or Redis does not answer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          examples: [admin@example.com]
        password:
          type: string
          description: At most 1024 bytes.
    Role:
      type: string
      description: "`viewer` reads (wallboards), `operator` changes inventory and probes, `admin` everything, users and roles included."
      enum: [viewer, operator, admin]
    Session:
      type: object
      additionalProperties: false
      required: [id, user, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifies the session in audit records. It is not the cookie and cannot be used to log in.
        user:
          $ref: "#/components/schemas/SessionUser"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the session ends however active it is; without requests it ends sooner.
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Status:
      type: string
      description: "`disabled` keeps the entity and its history but takes it out of use. Disabling an environment does not change its applications' status."
      enum: [active, disabled]
    EnvironmentType:
      type: string
      enum: [production, staging, development, test]
    Criticality:
      type: string
      enum: [low, medium, high, critical]
    Name:
      type: string
      description: Leading and trailing spaces are dropped; then 1 to 200 characters, without control characters.
      minLength: 1
      maxLength: 200
    Slug:
      type: string
      description: |
        The environment as the collectors and the telemetry name it: each
        collector's `environment` setting, the `environment` label of
        Heartbeat's metrics and the `deployment.environment.name` of logs
        (ADR 0017 §2). Lower-case letters, digits and hyphens, 1 to 63,
        starting and ending with a letter or a digit, so that it works as a
        label value, in a URL and as a Kubernetes name. Unique, and fixed
        once created.
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      examples: [prod]
    Labels:
      type: object
      description: At most 64 labels; keys of 1 to 63 characters, values of at most 256, without control characters. A change replaces them all.
      additionalProperties:
        type: string
        maxLength: 256
      maxProperties: 64
    Environment:
      type: object
      additionalProperties: false
      required: [id, name, slug, type, description, status, labels, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        slug:
          $ref: "#/components/schemas/Slug"
        type:
          $ref: "#/components/schemas/EnvironmentType"
        description:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewEnvironment:
      type: object
      additionalProperties: false
      required: [name, slug, type]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        slug:
          $ref: "#/components/schemas/Slug"
        type:
          $ref: "#/components/schemas/EnvironmentType"
        description:
          type: string
          description: At most 2000 characters; empty when left out.
          maxLength: 2000
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
    EnvironmentUpdate:
      type: object
      additionalProperties: false
      description: The fields to change; the slug cannot.
      properties:
        name:
          $ref: "#/components/schemas/Name"
        type:
          $ref: "#/components/schemas/EnvironmentType"
        description:
          type: string
          maxLength: 2000
        status:
          $ref: "#/components/schemas/Status"
        labels:
          $ref: "#/components/schemas/Labels"
    EnvironmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
    Application:
      type: object
      additionalProperties: false
      required: [id, environment_id, name, platform, owner_team, criticality, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        environment_id:
