  /api/v1/probe-assignments:
    get:
      operationId: listProbeAssignments
      tags: [probe-assignments]
      summary: List probe assignments
      security:
        - session: [viewer]
      description: Assignments in the order they were created, a page at a time. Filter by target or state.
      parameters:
        - name: database_target_id
          in: query
          description: Only the assignments of this database target.
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          description: Only the assignments in this state.
          schema:
            $ref: "#/components/schemas/AssignmentState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAssignmentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProbeAssignment
      tags: [probe-assignments]
      summary: Create a probe assignment
      security:
        - session: [operator]
      description: |
        Assigns a probe definition version to a database target, as a
        draft: nothing runs it until an admin approves it. A target runs
        each probe once, so a second assignment of the definition, or of
        another that runs the same probe (a custom definition runs the
        built-in it overrides), is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProbeAssignment"
      responses:
        "201":
          description: Created, as a draft.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/NoOwner"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-assignments/rendered:
    get:
      operationId: getRenderedProbeAssignments
      tags: [probe-assignments]
      summary: Get the rendered managedCollectors values file
      security:
        - session: [operator]
      description: |
        The values file that holds `managedCollectors` (ADR 0014 §2): every
        approved, enabled assignment of an active target and an enabled
        definition, one `sqlserver` collector per target, with the ID
        `api-<target id>-<interval>s`. Deterministic: the same approvals
        render the same bytes. Checked with the integrations schema and the
        collector's loader before it is served. Pass it to `helm upgrade`
        after the environment's own values; on kind, `make kind-assignments`
        does.
      responses:
        "200":
          description: The values file.
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-assignments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProbeAssignment
      tags: [probe-assignments]
      summary: Get a probe assignment
      security:
        - session: [viewer]
      responses:
        "200":
          description: The assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProbeAssignment
      tags: [probe-assignments]
      summary: Change a probe assignment
      security:
        - session: [operator]
      description: |
        Changes the fields the body holds and keeps the others. A change
        puts the assignment back to draft, unapproved, and the next render
        leaves it out until an admin approves it again. A body that changes
        nothing is answered with the assignment as it is, and audits
        nothing. Its target cannot change; `probe_definition_id` may name
        another version of the same definition only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeAssignmentUpdate"
      responses:
        "200":
          description: The assignment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/NoOwner"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProbeAssignment
      tags: [probe-assignments]
      summary: Delete a probe assignment
      security:
        - session: [operator]
      description: Deletes it in any state; the next render leaves it out.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-assignments/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: approveProbeAssignment
      tags: [probe-assignments]
      summary: Approve a probe assignment
      security:
        - session: [admin]
      description: |
        Approves a draft or rejected assignment: the next render holds it
        (ADR 0014 §3). The render with the approval is checked as the
        collector will check it, and an approval that would make it invalid
        is refused. A target runs at one interval, its collector's
        `scrape_interval`, so an assignment whose interval differs from the
        target's other approved ones is refused too.
      responses:
        "200":
          description: The assignment, approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-assignments/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rejectProbeAssignment
      tags: [probe-assignments]
      summary: Reject a probe assignment
      security:
        - session: [admin]
      description: Rejects a draft, with the reason given. It is not rendered; change it, or approve it after all, to try again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeAssignmentRejection"
      responses:
        "200":
          description: The assignment, rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-definitions:
    get:
      operationId: listProbeDefinitions
      tags: [probe-definitions]
      summary: List probe definitions
      security:
        - session: [viewer]
      description: The latest version of every definition, built-in and custom, sorted by engine and name.
      responses:
        "200":
          description: The definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinitionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProbeDefinition
      tags: [probe-definitions]
      summary: Create a custom probe definition
      security:
        - session: [admin]
      description: |
        Stores version 1 of a custom definition. Its `query_template` must
        be one read-only `SELECT`, checked as the db-collector checks it when
        it loads its configuration, and `overrides` must name an enabled
        built-in probe of the same engine. Review the query with the
        [probe review checklist](https://gdpais.github.io/Heartbeat/architecture/database-observability.html#probe-review-checklist)
        before it runs on a shared or production target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProbeDefinition"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The new version's URL.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-definitions/{id}:
    parameters:
      - $ref: "#/components/parameters/ProbeDefinitionID"
    get:
      operationId: getProbeDefinition
      tags: [probe-definitions]
      summary: Get a probe definition version
      security:
        - session: [viewer]
      description: One version, the latest or an older one an assignment pins.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProbeDefinition
      tags: [probe-definitions]
      summary: Enable or disable a custom probe definition
      security:
        - session: [admin]
      description: |
        Disables, or enables again, the custom definition this is a version
        of: every version of it. Definitions are disabled, never deleted,
        since assignments may pin their versions. Built-in definitions are
        read-only (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeDefinitionPatch"
      responses:
        "200":
          description: The version, as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/probe-definitions/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ProbeDefinitionID"
    get:
      operationId: listProbeDefinitionVersions
      tags: [probe-definitions]
      summary: List a probe definition's versions
      security:
        - session: [viewer]
      description: Every version of the definition this is a version of, the newest first.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinitionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProbeDefinitionVersion
      tags: [probe-definitions]
      summary: Change a custom probe definition
      security:
        - session: [admin]
      description: |
        Adds the next version of the custom definition whose latest version
        this is, holding the request's content: a version is the whole
        content, so a field left out takes its default, not the previous
        version's value. The query is checked as on creation. Older versions
        stay as they were, for the assignments that pin them.

        The path names the version the change starts from; when it is no
        longer the latest, because someone added a version since it was
        read, the change is refused (409), so no change is lost. Content
        equal to that version's adds nothing (200). Built-in and disabled
        definitions get no versions (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeDefinitionContent"
      responses:
        "201":
          description: The new version.
          headers:
            Location:
              description: The new version's URL.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "200":
          description: Nothing changed; the version the path names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/account/password:
    put:
      operationId: changeOwnPassword
      tags: [users]
      summary: Change your own password
      security:
        - session: [viewer]
      description: |
        Sets a new password for the session's user, given the current one.
        Every session of the user ends, this one included, so the response
        clears the cookie: log in again with the new password. A wrong
        current password counts against the same limits as a failed login,
        and past them the answer is 429 without checking it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed; every session of the user has ended.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current password is wrong, or the `Origin` header is not the configured site.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyFailures"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users:
