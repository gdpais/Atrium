          type: string
          format: uuid
          description: The application it belongs to, fixed when it was created.
        environment_id:
          type: string
          format: uuid
          description: Its application's environment, read through the application; a component has none of its own.
        name:
          $ref: "#/components/schemas/Name"
        component_type:
          $ref: "#/components/schemas/ComponentType"
        runtime_name:
          type: string
        labels:
